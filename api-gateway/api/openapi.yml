openapi: 3.0.3
info:
  title: api-gateway
  version: 1.0.0
  description: 'Puerta única de CampusSeguro para el tráfico externo y entre microservicios (GW - CampusSeguro).


    **Qué define este contrato:** lo que ve quien llama al GW: rutas expuestas, política de acceso de cada una, credenciales, cabeceras y errores propios del GW. Los valores transversales están en los [Estándares de Integración](https://github.com/CampusSeguro-DOSW-2026-2/documentation/blob/main/integration/standards.md) (EST); la tabla de rutas y la configuración, en [contracts.md](../contracts.md) (GW-C). Los cuerpos de cada operación se referencian desde el `openapi.yml` del MS dueño y no se copian aquí.


    **Políticas (`x-politica`):** `PUBLICA` sin credencial; `PROTEGIDA` con JWT **o** clave de servicio (por defecto); `INTERNA` solo con clave de servicio. `x-destino` indica la variable del MS al que se reenvía.


    **Cómo llamar al GW:**

    * **Clientes externos** (frontend, Postman): `Authorization: Bearer <JWT>` emitido por `POST /api/v1/auth/login`. Si un cambio de roles, de permisos de un rol o de estado de la cuenta invalida el token, el GW responde `401 NO_AUTENTICADO` y se vuelve a iniciar sesión (EST §3).

    * **Microservicios** (EST §5): `${GATEWAY_URL}/api/v1/...` con `X-Service-Key`, el `X-Correlation-ID` recibido y, si actúan en nombre de un usuario, los `X-User-Id`, `X-User-Role` y `X-User-Permission` recibidos sin modificarlos, las tres juntas. Nunca envían `Authorization` junto con `X-Service-Key`.


    **Qué recibe el MS destino** (EST §4): `X-User-Id`, `X-User-Role`, `X-User-Permission` y `X-Correlation-ID`; además `X-Service-Name` (`ms01`…`ms08`) en las llamadas internas. Nunca recibe `Authorization` ni `X-Service-Key`. El método, la ruta, los query params y el cuerpo llegan sin cambios.


    **Errores:** los del GW usan `ErrorResponse` (GW-C §4). Los errores de un MS se propagan sin cambios si cumplen `ErrorResponse` (cinco campos, `status` = código HTTP, `correlation_id` = el de la petición); si no, el GW responde `502`. Cada operación lista solo su respuesta exitosa y los errores del GW; los errores de negocio están en el contrato del MS.


    **Rutas que publica este contrato:** todas las operaciones de MS01 y MS04, las rutas públicas de MS02 y las rutas internas de MS01, MS06 y MS08. Las demás operaciones de MS02, MS03, MS05, MS06, MS07 y MS08 se reenvían por la tabla de prefijos de GW-C §1 con la política `PROTEGIDA` y se documentan en el `openapi.yml` de cada MS.



    **Rutas fuera de la tabla de prefijos:** `404 NO_ENCONTRADO` sin llamar a ningún MS. Una ruta dentro de un prefijo llega al MS dueño, que responde con su propio `ErrorResponse` si no la tiene. El preflight CORS (`OPTIONS`) lo resuelve el GW (EST §2.1). La consulta interna de cortes de sesión de MS01 (`/api/v1/internal/session-cuts`) la consume el propio GW y no se publica.'
servers:
  - url: http://localhost:8080
    description: Acceso externo (desarrollo local)
  - url: http://api-gateway:8080
    description: Acceso interno desde los MS (red Docker, `GATEWAY_URL`)
  - url: https://{dominio}
    description: Nube, producción (aislamiento en la nube, GW-C §7). También es el `GATEWAY_URL` de los MS de producción.
    variables:
      dominio:
        default: gw.example.com
        description: Dominio del GW (p. ej. <IP>.sslip.io)
  - url: https://{dominio}:8443
    description: Nube, prueba (aislamiento en la nube, GW-C §7). También es el `GATEWAY_URL` de los MS de prueba.
    variables:
      dominio:
        default: gw.example.com
        description: Dominio del GW (p. ej. <IP>.sslip.io)
tags:
  - name: Gateway
    description: Endpoints propios del GW (no se enrutan).
  - name: MS01 · Público
    description: Rutas públicas de `ms01-identity-and-access` (lista cerrada de EST §2).
  - name: MS01 · Protegido
    description: Rutas protegidas de `ms01-identity-and-access`. Cada MS autoriza con `X-User-Permission` contra el `x-permiso` de su contrato; el GW no autoriza.
  - name: MS01 · Interno
    description: Rutas internas de `ms01-identity-and-access` (solo MS con clave de servicio). MS01 autoriza por `X-Service-Name`, no por `X-User-Permission`.
  - name: MS02 · Público
    description: Rutas públicas de `ms02-campus-and-security` para la lectura de los códigos QR (lista cerrada de EST §2).
  - name: MS04 · Protegido
    description: Rutas de `ms04-evacuation-and-check-in`. Los usuarios llaman con JWT y MS04 autoriza con `X-User-Permission`; MS06 llama con su clave de servicio a las rutas que MS04 autoriza por `X-Service-Name`.
  - name: MS06 · Interno
    description: Rutas internas de `ms06-drills` (solo MS con clave de servicio). MS06 autoriza por `X-Service-Name`.
  - name: MS08 · Interno
    description: Rutas internas de `ms08-analytics-and-audit` (solo MS con clave de servicio).
security:
  - bearerAuth: []
  - serviceKey: []
paths:
  /actuator/health:
    get:
      tags:
        - Gateway
      summary: Healthcheck del GW (RF-GW-07)
      description: Responde en ≤ 200 ms con el estado propio del GW, sin consultar a otros servicios. El resto de Actuator solo está en el puerto de gestión interno.
      x-politica: PUBLICA
      x-destino: GW
      security: []
      responses:
        '200':
          description: GW en funcionamiento.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: El propio GW no está sano.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN
  /api/v1/auth/register:
    post:
      tags:
        - MS01 · Público
      summary: Solicitar el registro y enviar el código de verificación (RF-MS01-01)
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: Registro pendiente; MS01 envió el código de verificación al correo y devuelve el token de registro.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/RegisterAcceptedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/register/verify:
    post:
      tags:
        - MS01 · Público
      summary: Confirmar el correo con el código y crear el usuario (RF-MS01-01)
      description: El GW nunca registra el cuerpo (RF-GW-07).
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/VerifyRegistrationRequest'
      responses:
        '201':
          description: Usuario creado (MS01).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/RegisterResponse'
              example:
                id: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
                correo: maria.perez@escuelaing.edu.co
                roles:
                  - ESTUDIANTE
                estado: ACTIVO
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/register/resend:
    post:
      tags:
        - MS01 · Público
      summary: Reenviar el código de verificación del registro (RF-MS01-01)
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/ResendRegistrationCodeRequest'
      responses:
        '200':
          $ref: '#/components/responses/MensajeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/login:
    post:
      tags:
        - MS01 · Público
      summary: Autenticar usuario y obtener el JWT (RF-MS01-02)
      description: El GW nunca registra el cuerpo ni el token (RF-GW-07).
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticación exitosa (MS01).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/password/forgot:
    post:
      tags:
        - MS01 · Público
      summary: Solicitar código de recuperación (RF-MS01-08)
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MensajeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/password/reset:
    post:
      tags:
        - MS01 · Público
      summary: Restablecer contraseña con código (RF-MS01-08)
      x-politica: PUBLICA
      x-destino: MS01_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MensajeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/public/spaces:
    get:
      tags:
        - MS02 · Público
      summary: Consultar un espacio por su QR (sin sesión)
      description: Sin sesión. Edificio, piso y la evacuación recomendada; si el espacio no está disponible devuelve un aviso. El GW la reenvía sin credencial.
      x-politica: PUBLICA
      x-destino: MS02_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos (MS02).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: "../../ms02-campus-and-security/api/openapi.yml#/components/schemas/EspacioPublicoResponse"
              example:
                nombre: Salón B-201
                tipo: SALON
                edificio: Bloque B
                piso: 2
                disponible: true
                evacuacion:
                  tieneRuta: true
                  zonaSegura: Plazoleta central
                  ubicacionZonaSegura: Frente al Bloque B
                  recorrido: Salga a la izquierda, baje por la escalera norte y siga hasta la plazoleta central.
                  estado: DISPONIBLE
                  recomendaciones:
                    - titulo: Sismo
                      recomendacion: Aléjese de las ventanas y no use el ascensor.
                tieneFotografia: false
                guia:
                  indicacion: Siga la ruta hasta la salida norte.
                  escaleras:
                    - Escalera norte
                  salida: Salida norte
                  salidaLatitud: 4.78263
                  salidaLongitud: -74.04251
                  zonaSegura: Plazoleta central
                  distanciaMetros: 85.0
                  duracionSegundos: 70.0
                  pasos:
                    - instruccion: Baje por la escalera norte hasta el primer piso.
                      distanciaMetros: 30.0
                    - instruccion: Salga por la salida norte y camine hasta la plazoleta central.
                      distanciaMetros: 55.0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/public/exits:
    get:
      tags:
        - MS02 · Público
      summary: Consultar una salida por su QR (sin sesión)
      description: Sin sesión. Edificio, piso y coordenadas de la salida. El GW la reenvía sin credencial.
      x-politica: PUBLICA
      x-destino: MS02_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos (MS02).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: "../../ms02-campus-and-security/api/openapi.yml#/components/schemas/SalidaPublicaResponse"
              example:
                nombre: Salida norte
                edificio: Bloque B
                piso: 1
                latitud: 4.78263
                longitud: -74.04251
                disponible: true
                tieneFotografia: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/public/safe-zones:
    get:
      tags:
        - MS02 · Público
      summary: Consultar una zona segura por su QR (sin sesión)
      description: Sin sesión. Ubicación, coordenadas y si es punto de encuentro. El GW la reenvía sin credencial.
      x-politica: PUBLICA
      x-destino: MS02_URI
      security: []
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - name: id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Datos públicos (MS02).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: "../../ms02-campus-and-security/api/openapi.yml#/components/schemas/ZonaSeguraPublicaResponse"
              example:
                codigo: ZS-01
                nombre: Plazoleta central
                ubicacion: Frente al Bloque B
                puntoEncuentro: true
                latitud: 4.78301
                longitud: -74.04219
                disponible: true
                tieneFotografia: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/auth/logout:
    post:
      tags:
        - MS01 · Protegido
      summary: Cerrar sesión (RF-MS01-04)
      description: Protegida aunque esté bajo `/auth` (GW-C §3).
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
      responses:
        '200':
          $ref: '#/components/responses/MensajeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/me:
    get:
      tags:
        - MS01 · Protegido
      summary: Consultar usuario autenticado (RF-MS01-03, RF-MS01-06)
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
      responses:
        '200':
          $ref: '#/components/responses/UserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
    put:
      tags:
        - MS01 · Protegido
      summary: Actualizar perfil propio (RF-MS01-06)
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/me/password:
    put:
      tags:
        - MS01 · Protegido
      summary: Cambiar contraseña autenticado (RF-MS01-08)
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MensajeOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users:
    get:
      tags:
        - MS01 · Protegido
      summary: Listar y buscar usuarios (RF-MS01-07)
      description: Los query params (`correo`, `estado`, `rol`, `page`, `size`) son los del contrato MS01 y se reenvían sin cambios.
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
      responses:
        '200':
          description: Página de usuarios (MS01).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/UserPage'
              example:
                contenido:
                  - id: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
                    primer_nombre: María
                    segundo_nombre: José
                    primer_apellido: Pérez
                    segundo_apellido: Gómez
                    correo: maria.perez@escuelaing.edu.co
                    roles:
                      - BRIGADISTA
                      - ESTUDIANTE
                    estado: ACTIVO
                page: 0
                size: 20
                total_elementos: 1
                total_paginas: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
  /api/v1/users/{id}:
    get:
      tags:
        - MS01 · Protegido
      summary: Consultar usuario por id (RF-MS01-05, RF-MS01-07)
      x-politica: PROTEGIDA
      x-destino: MS01_URI
      parameters:
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - name: id
          in: path
          required: true
          description: UUID del usuario. El GW lo reenvía sin validarlo.
          schema:
            type: string
            format: uuid
            example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
      responses:
        '200':
          $ref: '#/components/responses/UserOk'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
