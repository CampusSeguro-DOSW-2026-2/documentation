              evento_id: 11111111-1111-4111-8111-111111111111
              tipo_evento: SIMULACRO
              atributos:
                estado: SAFE
                punto_encuentro: PE_BLOQUE_B
                ubicacion_tipo: BUILDING
                ubicacion_id: bloque-b
      responses:
        '202':
          description: Evento aceptado (MS08).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT RS256 emitido por MS01. El GW verifica la firma y los claims localmente y aplica los cortes de sesión de MS01 (EST §3). Solo para clientes externos. El GW lo elimina antes de reenviar, incluso en rutas públicas.'
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: 'Clave de servicio del MS llamante (`GATEWAY_SERVICE_KEY`, EST §5). Solo para llamadas entre MS. El GW la valida en tiempo constante, la elimina e inyecta `X-Service-Name`.'
  headers:
    XCorrelationID:
      description: UUID v4 de la petición, conservado o generado por el GW. Va en toda respuesta.
      schema:
        type: string
        format: uuid
        example: c19b472d-7a2a-4d3b-a12b-abcdef123456
  parameters:
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: UUID v4 de trazabilidad. Un MS llamante envía el que recibió. Si falta o no es un UUID v4 válido, el GW genera uno nuevo y nunca rechaza la petición.
      schema:
        type: string
        example: c19b472d-7a2a-4d3b-a12b-abcdef123456
    XUserId:
      name: X-User-Id
      in: header
      required: false
      description: 'Solo en llamadas internas con `X-Service-Key`, cuando el MS actúa en nombre de un usuario: el valor recibido, sin modificarlo. Va junto con `X-User-Role` y `X-User-Permission`, cada una una sola vez; si falta alguna, se repite o tiene formato inválido, 400. En peticiones externas el GW lo elimina y usa el `sub` del JWT.'
      schema:
        type: string
        format: uuid
        example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
    XUserRole:
      name: X-User-Role
      in: header
      required: false
      description: 'Solo en llamadas internas con `X-Service-Key`, junto con `X-User-Id` y `X-User-Permission`: los roles recibidos, sin modificarlos (separados por coma, sin espacios, en orden alfabético). En peticiones externas el GW lo elimina y usa los `roles` del JWT.'
      schema:
        type: string
        pattern: ^[A-Z][A-Z0-9_]{1,29}(,[A-Z][A-Z0-9_]{1,29})*$
        example: BRIGADISTA,ESTUDIANTE
    XUserPermission:
      name: X-User-Permission
      in: header
      required: false
      description: 'Solo en llamadas internas con `X-Service-Key`, junto con `X-User-Id` y `X-User-Role`: los permisos recibidos, sin modificarlos (separados por coma, sin espacios, en orden alfabético). En peticiones externas el GW lo elimina y usa los `permissions` del JWT.'
      schema:
        type: string
        pattern: ^ms[0-9]{2}:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*(,ms[0-9]{2}:[a-z][a-z0-9_]*:[a-z][a-z0-9_]*)*$
        example: ms04:checkin:write,ms07:content:read
    RolePath:
      name: rol
      in: path
      required: true
      description: Nombre del rol. El GW lo reenvía sin validarlo; MS01 recorta los espacios y lo pasa a mayúsculas (RG-08).
      schema:
        type: string
        example: MONITOR_EVACUACION
  responses:
    MensajeOk:
      description: Operación exitosa (MS).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/MensajeResponse'
    RoleOk:
      description: Rol con su detalle (MS01).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/RoleDetail'
    UserOk:
      description: Usuario (MS01).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '../../ms01-identity-and-access/api/openapi.yml#/components/schemas/User'
          example:
            id: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
            primer_nombre: María
            segundo_nombre: José
            primer_apellido: Pérez
            segundo_apellido: Gómez
            correo: maria.perez@escuelaing.edu.co
            roles:
              - BRIGADISTA
              - ESTUDIANTE
            estado: ACTIVO
    BadRequest:
      description: 'GW: varias cabeceras `Authorization` o `X-Service-Key`, `Authorization` junto con `X-Service-Key`, o identidad de usuario incompleta, repetida o con formato inválido (`X-User-Id`, `X-User-Role`, `X-User-Permission`) en una llamada interna. También se propagan los 400 válidos del MS.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            codigo: VALIDACION
            mensaje: Solicitud inválida.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    Unauthorized:
      description: 'GW: JWT ausente, inválido o anterior a un corte de sesión (RF-GW-02), o clave de servicio ausente o inválida (RF-GW-08). El MS no recibe la petición.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            codigo: NO_AUTENTICADO
            mensaje: Token ausente, inválido o expirado.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    CorsForbidden:
      description: 'GW: preflight CORS con origen, método o cabeceras no permitidos (RF-GW-04).'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            codigo: PROHIBIDO
            mensaje: Acceso denegado por la política perimetral.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    NotFound:
      description: 'GW: ruta sin destino (RF-GW-01). No se invoca ningún MS.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: Ruta no encontrada.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    InternalError:
      description: 'GW: excepción no controlada (RF-GW-05). También se propagan los 500 válidos del MS.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            codigo: ERROR_INTERNO
            mensaje: Error interno del servidor.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    BadGateway:
      description: 'GW: MS inalcanzable (incluido un TLS rechazado en la nube) o error downstream que no cumple `ErrorResponse` (RF-GW-05). El detalle queda solo en el log del GW.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 502
            codigo: SERVICIO_NO_DISPONIBLE
            mensaje: Servicio temporalmente no disponible.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    GatewayTimeout:
      description: 'GW: el MS supera `GATEWAY_DOWNSTREAM_TIMEOUT_MS` (RF-GW-01). Sin reintentos.'
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 504
            codigo: TIEMPO_AGOTADO
            mensaje: El servicio de destino no respondió a tiempo.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP
    ErrorResponse:
      type: object
      description: Cuerpo de error de EST §7.1. Los cinco campos son obligatorios y nunca `null`; sin trazas, URIs internas, IPs ni secretos.
      additionalProperties: false
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          description: Igual al código HTTP.
          example: 401
        codigo:
          type: string
          description: Código del catálogo de EST §7.2.
          example: NO_AUTENTICADO
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
        correlation_id:
          type: string
          format: uuid
          description: Igual a la cabecera X-Correlation-ID.
          example: c19b472d-7a2a-4d3b-a12b-abcdef123456
