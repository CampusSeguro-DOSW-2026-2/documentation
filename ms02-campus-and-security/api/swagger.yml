openapi: 3.1.0
info:
  title: MS02 Campus y seguridad
  description: |-
    Edificios, pisos, espacios, zonas seguras y rutas de evacuaci├│n de CampusSeguro.

    **Entradas de identidad:** los endpoints protegidos reciben `X-User-Id` y `X-User-Role` (roles separados por coma), que pone el API Gateway; todos aceptan `X-Correlation-ID`. Si faltan las de identidad, MS02 responde 401. Cada operaci├│n declara su permiso en `x-permiso` y los roles que lo tienen en `x-roles`.
  version: v1
servers:
- url: http://localhost:8080
  description: Acceso externo (API Gateway)
- url: http://localhost:8082
  description: "MS02 directo, solo desarrollo"
tags:
- name: Recomendaciones preventivas
  description: RF-13. Informaci├│n preventiva para edificios y tipos de espacio.
- name: Consulta p├║blica
  description: "ADR-003 (D7). Lo que se ve al escanear un QR en una emergencia: solo\
    \ lectura, sin sesi├│n y con datos m├¡nimos."
- name: C├│digos QR
  description: ADR-003. QR generados a partir del UUID del elemento. Solo contienen
    el enlace a la pantalla p├║blica del frontend.
- name: Im├ígenes
  description: Almacenamiento y consulta de fotograf├¡as de elementos del campus.
- name: Rutas de evacuaci├│n
  description: "RF-05. Gesti├│n de rutas: cada espacio tiene como m├íximo una ruta hacia\
    \ una zona segura."
- name: Consulta de rutas
  description: RF-06. Ruta recomendada para el usuario seg├║n el edificio o el espacio
    donde est├í.
- name: Edificios
  description: RF-01. Gesti├│n de edificios del campus.
- name: Salidas
  description: "ADR-003. Salidas del edificio al exterior, con el piso desde el que\
    \ se sale y sus coordenadas."
- name: Zonas abiertas
  description: "ADR-003. Espacios exteriores del campus (zonas verdes, plazoletas...)."
- name: Zonas seguras
  description: RF-04. Zonas seguras o puntos de encuentro a los que se evac├║a.
- name: Espacios
  description: "RF-03. Salones, laboratorios, auditorios, oficinas y espacios comunes\
    \ de un piso."
- name: Pisos
  description: "RF-02. Pisos de un edificio, identificados por n├║mero (negativo para\
    \ s├│tanos)."
- name: Campus
  description: ADR-003. Gesti├│n de campus; agrupa edificios y zonas abiertas.
- name: Rutas exteriores
  description: ADR-003. Recorrido peatonal desde una salida del edificio hasta una
    zona segura.
- name: Escaleras
  description: RF-04. Escaleras y pisos que conectan dentro de un edificio.
