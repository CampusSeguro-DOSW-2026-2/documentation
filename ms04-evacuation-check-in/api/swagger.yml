openapi: 3.0.3
info:
  title: ms04-evacuation-and-check-in
  version: 2.0.0
  description: 'Reporte del estado de las personas, consolidación por punto de encuentro y habilitación del check-in según el estado del evento (MS04 - CampusSeguro).


    **Estándares:** cabeceras, errores y paginación siguen los [Estándares de Integración](https://github.com/CampusSeguro-DOSW-2026-2/documentation/wiki/Est%C3%A1ndares-de-Integraci%C3%B3n-y-Contratos-Transversales); `x-permiso`/`x-roles` siguen la [Matriz Rol‐Permiso](https://github.com/CampusSeguro-DOSW-2026-2/documentation/wiki/Matriz-Rol%E2%80%90Permiso).


    **Rutas protegidas:** reciben `X-User-Id` y `X-User-Role` (roles separados por coma) y aceptan `X-Correlation-ID`. Si faltan las de identidad, MS04 responde 401 `NO_AUTENTICADO`. La identidad nunca viaja en el cuerpo (RN-MS04-06).


    **Rutas internas (solo MS06):** reciben `X-Service-Name` (que el Gateway deriva de la clave de servicio) y aceptan `X-Correlation-ID`. Solo las puede usar `ms06-drills`: sin `X-Service-Name` responden 401 `NO_AUTENTICADO` y con otro servicio, 403 `PROHIBIDO` (RN-MS04-23). No declaran `x-permiso`. Sus cuerpos usan camelCase, como se acordó con MS06; el resto del contrato usa snake_case.


    **Evento:** el `eventoId` es el UUID que asigna MS06 (RN-MS04-01). MS04 solo conoce los eventos que MS06 le envía por `PUT /chi/eventos/{eventoId}/estado` y habilita el check-in solo con el evento `EN_EJECUCION` (RN-MS04-19). Las consultas funcionan en cualquier estado del evento (RN-MS04-22).


    **Estados del evento:** `BORRADOR`, `PROGRAMADO`, `EN_EJECUCION` y `FINALIZADO`. Simulacros y eventos reales siguen los mismos estados: MS04 guarda el que envía MS06 (RN-MS04-20).


    **Estados del check-in:** `SAFE` (Estoy a salvo), `EVACUATING` (Me estoy evacuando), `NEEDS_ASSISTANCE` (Requiero asistencia) y `OFF_CAMPUS` (No estoy en el campus) (RN-MS04-03). El estado vigente de una persona es su check-in más reciente en el evento (RN-MS04-07).


    **Código propio:** `DEPENDENCIA_NO_DISPONIBLE` (503), cuando MS01, MS02 o MS05 no responden (RNF-MS04-11).


    **Auditoría:** MS04 no expone endpoints de auditoría; emite eventos asíncronos a `ms08-analytics-and-audit` (RNF-MS04-17).'
servers:
  - url: http://localhost:8080/api/v1
    description: Acceso externo (API Gateway)
tags:
  - name: Estado del evento (interno MS06)
  - name: Consulta de eventos
  - name: Evento activo
  - name: Check-in propio
  - name: Consolidación
  - name: Asistencia
  - name: Histórico y resultados
paths:
  /chi/eventos/{eventoId}/estado:
    put:
      tags:
        - Estado del evento (interno MS06)
      summary: Recibir el estado del evento y habilitar o deshabilitar el check-in (RF-MS04-11, F-05)
      x-acceso: interna
      x-servicio-autorizado: ms06-drills
      description: 'Ruta interna de MS06. Crea el evento si no existe (201) o lo actualiza (200). `PROGRAMADO` guarda cuándo, dónde y a quiénes aplica el check-in y se envía al programar y al reprogramar. `EN_EJECUCION` habilita el check-in y `FINALIZADO` lo deshabilita. `BORRADOR` cancela la programación y elimina la fecha de inicio. Un evento real (`simulacro = false`) sigue los mismos estados que un simulacro. Repetir `EN_EJECUCION` o `FINALIZADO` es idempotente (200). Las transiciones permitidas están en RN-MS04-21: cualquier otra, o cambiar `simulacro`, responde 409.'
      parameters:
        - $ref: '#/components/parameters/XServiceName'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoEventoRequest'
            examples:
              programar:
                summary: Programar o reprogramar un simulacro
                value:
                  eventoId: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
                  nombre: Simulacro de evacuación bloque A
                  simulacro: true
                  estado: PROGRAMADO
                  fechaInicio: '2026-11-20T10:00:00-05:00'
                  escenario:
                    edificios: [Bloque A]
                    zonas: [Zona norte]
                  rolesConvocados: [ESTUDIANTE, PROFESOR]
              habilitar:
                summary: Iniciar el simulacro (habilita el check-in)
                value:
                  eventoId: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
                  nombre: Simulacro de evacuación bloque A
                  simulacro: true
                  estado: EN_EJECUCION
                  fechaInicio: '2026-11-20T10:00:00-05:00'
                  escenario:
                    edificios: [Bloque A]
                    zonas: [Zona norte]
                  rolesConvocados: [ESTUDIANTE, PROFESOR]
              deshabilitar:
                summary: Finalizar el evento (deshabilita el check-in)
                value:
                  eventoId: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
                  nombre: Simulacro de evacuación bloque A
                  simulacro: true
                  estado: FINALIZADO
                  escenario:
                    edificios: [Bloque A]
                    zonas: [Zona norte]
                  rolesConvocados: [ESTUDIANTE, PROFESOR]
              cancelarProgramacion:
                summary: Cancelar la programación (el evento perdió su fecha de inicio)
                value:
                  eventoId: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
                  nombre: Simulacro de evacuación bloque A
                  simulacro: true
                  estado: BORRADOR
                  rolesConvocados: [ESTUDIANTE, PROFESOR]
              emergenciaIniciada:
                summary: Evento real que MS06 inicia (habilita el check-in)
                value:
                  eventoId: 2b9e4f61-8c3d-4a57-b1e0-6f7a9d3c1e84
                  nombre: Evacuación por emergencia
                  simulacro: false
                  estado: EN_EJECUCION
                  rolesConvocados: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      responses:
        '201':
          description: Evento nuevo guardado.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoInterno'
        '200':
          description: Evento actualizado, o repetido sin cambios (idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoInterno'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '403':
          $ref: '#/components/responses/ForbiddenInternal'
        '409':
          description: Transición de estado no permitida (p. ej. desde `FINALIZADO`) o `simulacro` distinto del guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                codigo: CONFLICTO
                mensaje: La transición de estado no está permitida.
                errores: []
                correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
  /chi/eventos/{eventoId}/checkins:
    get:
      tags:
        - Estado del evento (interno MS06)
      summary: Entregar a MS06 el detalle de check-ins del evento (RF-MS04-12, F-06)
      x-acceso: interna
      x-servicio-autorizado: ms06-drills
      description: 'Ruta interna de MS06. Devuelve un elemento por persona con su estado vigente (su check-in más reciente), del más antiguo al más reciente. `zonaId` es el id del punto de encuentro y solo viene con `SAFE`. `nombre` es nulo si MS01 no respondió. El formato de la respuesta es el acordado con MS06. Funciona con el evento en cualquier estado.'
      parameters:
        - $ref: '#/components/parameters/XServiceName'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
        - name: estado
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/EstadoCheckin'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de check-ins vigentes.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleCheckinsMs06'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/UnauthorizedInternal'
        '403':
          $ref: '#/components/responses/ForbiddenInternal'
        '404':
          $ref: '#/components/responses/EventNotFound'
    post:
      tags:
        - Check-in propio
      summary: Registrar o actualizar el propio check-in (RF-MS04-02, RF-MS04-03, RF-MS04-04, F-01)
      x-permiso: [ms04:checkin:write, ms04:assistance:request]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Solo con el evento `EN_EJECUCION` y si el rol del usuario está entre los roles convocados. Si el usuario no tiene check-in en el evento lo crea (201). Si ya tiene uno y cambia el estado (o el punto de encuentro con `SAFE`), agrega un check-in nuevo y ese pasa a ser el vigente (200). Si es igual al vigente, devuelve el vigente sin agregar nada (200). `NEEDS_ASSISTANCE` exige además `ms04:assistance:request` y genera la solicitud en MS05. Un campo que no corresponde al estado o un id de usuario en el cuerpo se rechaza con 400.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckinRequest'
            examples:
              estoyASalvo:
                summary: Estoy a salvo
                value:
                  estado: SAFE
                  punto_encuentro_id: 3
              meEstoyEvacuando:
                summary: Me estoy evacuando
                value:
                  estado: EVACUATING
              requieroAsistencia:
                summary: Requiero asistencia
                value:
                  estado: NEEDS_ASSISTANCE
                  ubicacion:
                    tipo: EDIFICIO
                    id: 12
              noEstoyEnElCampus:
                summary: No estoy en el campus
                value:
                  estado: OFF_CAMPUS
      responses:
        '201':
          description: Check-in registrado.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResponse'
        '200':
          description: Check-in nuevo agregado como estado vigente (o el vigente sin cambios si el estado es igual).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Evento o punto de encuentro inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                codigo: NO_ENCONTRADO
                mensaje: Punto de encuentro no encontrado.
                errores: []
                correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
        '409':
          description: El check-in del evento no está habilitado (evento `BORRADOR`, `PROGRAMADO` o `FINALIZADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 409
                codigo: CONFLICTO
                mensaje: El check-in de este evento no está habilitado.
                errores: []
                correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
        '422':
          description: El evento no le aplica al usuario (su rol no está convocado) o el punto de encuentro está inactivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 422
                codigo: REGLA_NEGOCIO
                mensaje: El punto de encuentro no está activo.
                errores: []
                correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chi/eventos/activos:
    get:
      tags:
        - Evento activo
      summary: Consultar eventos activos que le aplican al usuario (RF-MS04-01)
      x-permiso: ms04:checkin:read_own
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Eventos `EN_EJECUCION` cuyos roles convocados incluyen el rol del usuario, ordenados por fecha de inicio. Lista vacía si no hay ninguno.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Eventos activos (puede ser una lista vacía).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chi/eventos:
    get:
      tags:
        - Consulta de eventos
      summary: Listar eventos en cualquier estado (RF-MS04-13, F-07)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Eventos que MS04 conoce, tengan o no el check-in habilitado, ordenados por fecha de inicio del más reciente al más antiguo (los `BORRADOR`, sin fecha, al final). Es de solo lectura. El BRIGADISTA los ve todos, sin filtro de zona (RN-MS04-26).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - name: estado
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/EstadoEvento'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de eventos (puede estar vacía).
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventoPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /chi/eventos/{eventoId}:
    get:
      tags:
        - Consulta de eventos
      summary: Consultar un evento en cualquier estado (RF-MS04-13)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Devuelve el evento tal como lo guardó MS04, aunque su check-in esté deshabilitado. Es de solo lectura (RN-MS04-26).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: Evento.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
  /chi/eventos/{eventoId}/checkins/propio:
    get:
      tags:
        - Check-in propio
      summary: Consultar el propio estado vigente (RF-MS04-05)
      x-permiso: ms04:checkin:read_own
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Identifica al usuario por `X-User-Id`. Devuelve su check-in más reciente (el estado vigente), no los anteriores. Funciona con el evento en cualquier estado.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: Estado vigente del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Evento inexistente o el usuario no tiene check-in en el evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 404
                codigo: NO_ENCONTRADO
                mensaje: No tiene check-in en este evento.
                errores: []
                correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
  /chi/eventos/{eventoId}/consolidado:
    get:
      tags:
        - Consolidación
      summary: Consolidado del evento por estado y punto de encuentro (RF-MS04-06)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Se calcula con los estados vigentes. Siempre incluye los cuatro estados (0 si no hay personas). El BRIGADISTA solo recibe las personas en `SAFE` y `NEEDS_ASSISTANCE` de sus zonas asignadas; `EVACUATING` y `OFF_CAMPUS` salen en 0 porque esas personas no tienen ubicación (RN-MS04-14). Funciona con el evento en cualquier estado.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: Consolidado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Consolidado'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
  /chi/eventos/{eventoId}/personas:
    get:
      tags:
        - Consolidación
      summary: Listar personas por estado y punto de encuentro (RF-MS04-06, F-02)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Estados vigentes del evento, con el nombre de cada persona (nulo si MS01 no respondió). El BRIGADISTA solo recibe los de sus zonas asignadas (RN-MS04-14). `punto_encuentro_id` solo se combina con `estado=SAFE` o sin estado.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
        - name: estado
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/EstadoCheckin'
        - name: punto_encuentro_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 3
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de estados vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckinPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
  /chi/eventos/{eventoId}/pendientes:
    get:
      tags:
        - Consolidación
      summary: Personas pendientes (RF-MS04-07, F-03)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Usuarios ACTIVOS de MS01 cuyo rol está entre los roles convocados del evento y que no han reportado ninguno de los cuatro estados, con su nombre (nulo si MS01 no entregó el dato). `total_elementos` es el total de pendientes. El BRIGADISTA siempre recibe una lista vacía, porque los pendientes no tienen ubicación conocida (RN-MS04-14). Si MS01 no entrega la población objetivo responde 503.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendientePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /chi/eventos/{eventoId}/asistencia:
    get:
      tags:
        - Asistencia
      summary: Personas que requieren asistencia (RF-MS04-08, F-03)
      x-permiso: ms04:dashboard:read
      x-roles: [BRIGADISTA, COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Personas con estado vigente `NEEDS_ASSISTANCE`, del reporte más antiguo al más reciente, con su nombre, su solicitud en MS05 y su estado de envío. El BRIGADISTA solo recibe las de sus zonas asignadas. La asignación y la atención ocurren en MS05.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de personas que requieren asistencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
  /chi/eventos/{eventoId}/historial:
    get:
      tags:
        - Histórico y resultados
      summary: Histórico de check-ins del evento (RF-MS04-09, F-04)
      x-permiso: ms04:history:read
      x-roles: [COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Todos los check-ins del evento (cada reporte de cada usuario), en orden cronológico. Disponible con el evento en cualquier estado.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
        - name: usuario_id
          in: query
          schema:
            type: string
            format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        - name: estado
          in: query
          description: Omitir equivale a Todos.
          schema:
            $ref: '#/components/schemas/EstadoCheckin'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página del histórico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistorialPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
  /chi/eventos/{eventoId}/resultados:
    get:
      tags:
        - Histórico y resultados
      summary: Resultados del evento (RF-MS04-10)
      x-permiso: ms04:history:read
      x-roles: [COORDINADOR, ORGANIZADOR, AUDITOR]
      description: Datos de check-in del evento para el organizador, el auditor, MS06 y MS08. `finales` es false mientras el evento no esté `FINALIZADO`. MS04 no calcula indicadores (RN-MS04-18). La política de acceso para MS06 y MS08 está pendiente (decisión abierta n.º 6).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EventoId'
      responses:
        '200':
          description: Resultados del evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultados'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EventNotFound'
components:
  headers:
    XCorrelationID:
      description: UUID v4 de la petición (conservado o generado por el Gateway); enlaza logs y eventos de auditoría.
      schema:
        type: string
        format: uuid
        example: c19b472d-7a2a-4d3b-a12b-abcdef123456
  parameters:
    EventoId:
      name: eventoId
      in: path
      required: true
      description: Id (UUID) que asigna MS06 al evento (RN-MS04-01).
      schema:
        type: string
        format: uuid
        example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: UUID del usuario autenticado (claim `sub`).
      schema:
        type: string
        format: uuid
        example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      description: Roles del usuario autenticado separados por coma, en orden alfabético.
      schema:
        type: string
        example: BRIGADISTA,ESTUDIANTE
    XServiceName:
      name: X-Service-Name
      in: header
      required: true
      description: Servicio que llama a una ruta interna. Lo deriva el Gateway de la clave de servicio. Solo se acepta `ms06-drills` (RN-MS04-23).
      schema:
        type: string
        example: ms06-drills
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: UUID v4 de trazabilidad de la petición.
      schema:
        type: string
        format: uuid
        example: c19b472d-7a2a-4d3b-a12b-abcdef123456
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validación fallida (indica campo y regla).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            codigo: VALIDACION
            mensaje: Datos inválidos.
            errores:
              - campo: punto_encuentro_id
                mensaje: Seleccione el punto de encuentro donde está.
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    Unauthorized:
      description: Faltan las cabeceras de identidad (X-User-Id / X-User-Role).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            codigo: NO_AUTENTICADO
            mensaje: No autenticado.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    UnauthorizedInternal:
      description: Falta la cabecera X-Service-Name en una ruta interna.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            codigo: NO_AUTENTICADO
            mensaje: No autenticado.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    Forbidden:
      description: X-User-Role no tiene el permiso requerido por la operación (ver x-permiso).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            codigo: PROHIBIDO
            mensaje: No cuenta con los permisos suficientes para realizar esta operación.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    ForbiddenInternal:
      description: El servicio que llama no es `ms06-drills` (ver x-servicio-autorizado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            codigo: PROHIBIDO
            mensaje: No cuenta con los permisos suficientes para realizar esta operación.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    EventNotFound:
      description: Evento inexistente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: Evento no encontrado.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
    ServiceUnavailable:
      description: MS01, MS02 o MS05 no responden (código propio de MS04, RNF-MS04-11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 503
            codigo: DEPENDENCIA_NO_DISPONIBLE
            mensaje: El servicio no está disponible en este momento. Intente de nuevo.
            errores: []
            correlation_id: c19b472d-7a2a-4d3b-a12b-abcdef123456
  schemas:
    EstadoEvento:
      type: string
      enum:
        - BORRADOR
        - PROGRAMADO
        - EN_EJECUCION
        - FINALIZADO
      description: 'BORRADOR = sin fecha de inicio; PROGRAMADO = con fecha de inicio, check-in deshabilitado; EN_EJECUCION = check-in habilitado; FINALIZADO = check-in deshabilitado y datos conservados (RN-MS04-19, RN-MS04-21).'
      example: PROGRAMADO
    RolConvocado:
      type: string
      enum:
        - ESTUDIANTE
        - PROFESOR
        - ADMINISTRATIVO
        - BRIGADISTA
        - COORDINADOR
        - ORGANIZADOR
      description: Solo los roles que pueden reportar su estado (RN-MS04-24).
      example: ESTUDIANTE
    Escenario:
      type: object
      additionalProperties: false
      description: Edificios y zonas del evento tal como los envía MS06. Son informativos (RN-MS04-24).
      properties:
        edificios:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          example: [Bloque A]
        zonas:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          example: [Zona norte]
    EstadoEventoRequest:
      type: object
      additionalProperties: false
      required:
        - eventoId
        - nombre
        - simulacro
        - estado
        - rolesConvocados
      description: '`fechaInicio` es obligatoria con `PROGRAMADO`, no se envía con `BORRADOR` y es opcional con `EN_EJECUCION` y `FINALIZADO`. `eventoId` debe ser igual al de la ruta.'
      properties:
        eventoId:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Simulacro de evacuación bloque A
        simulacro:
          type: boolean
          description: false es un evento real; sigue los mismos estados que un simulacro (RN-MS04-20). No puede cambiar en un evento ya guardado.
          example: true
        estado:
          $ref: '#/components/schemas/EstadoEvento'
        fechaInicio:
          type: string
          format: date-time
          description: ISO-8601 con desfase horario. MS04 la guarda en UTC y no la compara con el reloj.
          example: '2026-11-20T10:00:00-05:00'
        escenario:
          $ref: '#/components/schemas/Escenario'
        rolesConvocados:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RolConvocado'
          example: [ESTUDIANTE, PROFESOR]
    EventoInterno:
      type: object
      description: Evento almacenado, tal como lo devuelve la ruta interna de MS06. `estado` es el efectivo y `checkinHabilitado` indica si el check-in quedó habilitado.
      required:
        - eventoId
        - nombre
        - simulacro
        - estado
        - escenario
        - rolesConvocados
        - checkinHabilitado
      properties:
        eventoId:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        nombre:
          type: string
          example: Simulacro de evacuación bloque A
        simulacro:
          type: boolean
          example: true
        estado:
          $ref: '#/components/schemas/EstadoEvento'
        fechaInicio:
          type: string
          format: date-time
          nullable: true
          description: null solo con `BORRADOR`.
          example: '2026-11-20T10:00:00-05:00'
        fechaCierre:
          type: string
          format: date-time
          nullable: true
          description: Fecha/hora en que MS04 recibió `FINALIZADO`; null en los demás estados.
          example: null
        escenario:
          $ref: '#/components/schemas/Escenario'
        rolesConvocados:
          type: array
          items:
            $ref: '#/components/schemas/RolConvocado'
          example: [ESTUDIANTE, PROFESOR]
        checkinHabilitado:
          type: boolean
          description: true solo con el evento `EN_EJECUCION` (RN-MS04-19).
          example: false
    Evento:
      type: object
      description: Evento tal como lo guarda MS04, en el contrato protegido.
      required:
        - evento_id
        - nombre
        - simulacro
        - estado
        - escenario
        - roles_convocados
        - checkin_habilitado
      properties:
        evento_id:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        nombre:
          type: string
          example: Simulacro de evacuación bloque A
        simulacro:
          type: boolean
          description: false es una emergencia o evento real.
          example: true
        estado:
          $ref: '#/components/schemas/EstadoEvento'
        fecha_inicio:
          type: string
          format: date-time
          nullable: true
          description: null solo con `BORRADOR`.
          example: '2026-11-20T15:00:00Z'
        fecha_cierre:
          type: string
          format: date-time
          nullable: true
          description: Solo con `FINALIZADO`.
          example: null
        escenario:
          $ref: '#/components/schemas/Escenario'
        roles_convocados:
          type: array
          items:
            $ref: '#/components/schemas/RolConvocado'
          example: [ESTUDIANTE, PROFESOR]
        checkin_habilitado:
          type: boolean
          description: true solo con el evento `EN_EJECUCION` (RN-MS04-19).
          example: false
    EstadoCheckin:
      type: string
      enum:
        - SAFE
        - EVACUATING
        - NEEDS_ASSISTANCE
        - OFF_CAMPUS
      description: 'SAFE = Estoy a salvo; EVACUATING = Me estoy evacuando; NEEDS_ASSISTANCE = Requiero asistencia; OFF_CAMPUS = No estoy en el campus (RN-MS04-03).'
      example: SAFE
    TipoUbicacion:
      type: string
      enum:
        - EDIFICIO
        - ESPACIO
        - PUNTO_ENCUENTRO
      description: Tipo de elemento de MS02 donde se requiere la asistencia (RN-MS04-09).
      example: EDIFICIO
    EstadoEnvio:
      type: string
      enum:
        - ENVIADA
        - PENDIENTE_ENVIO
        - RECHAZADA
      description: Estado del envío de la solicitud de asistencia a MS05 (RN-MS04-10).
      example: ENVIADA
    Ubicacion:
      type: object
      additionalProperties: false
      required:
        - tipo
        - id
      properties:
        tipo:
          $ref: '#/components/schemas/TipoUbicacion'
        id:
          type: integer
          format: int64
          minimum: 1
          description: Id del elemento en MS02.
          example: 12
    CheckinRequest:
      type: object
      additionalProperties: false
      required:
        - estado
      description: '`punto_encuentro_id` es obligatorio con SAFE y prohibido con los demás estados. `ubicacion` es obligatoria con NEEDS_ASSISTANCE y prohibida con los demás.'
      properties:
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          minimum: 1
          example: 3
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
    SolicitudAsistencia:
      type: object
      required:
        - estado_envio
      properties:
        id:
          type: string
          nullable: true
          description: Id de la solicitud en MS05; null mientras no haya llegado.
          example: null
        estado_envio:
          $ref: '#/components/schemas/EstadoEnvio'
    CheckinResponse:
      type: object
      required:
        - id
        - evento_id
        - estado
        - fecha_hora
      properties:
        id:
          type: string
          format: uuid
          description: Id del check-in (el más reciente del usuario en el evento).
          example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        evento_id:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          nullable: true
          example: 3
        ubicacion:
          allOf:
            - $ref: '#/components/schemas/Ubicacion'
          nullable: true
        solicitud_asistencia:
          allOf:
            - $ref: '#/components/schemas/SolicitudAsistencia'
          nullable: true
          description: Solo con NEEDS_ASSISTANCE.
        fecha_hora:
          type: string
          format: date-time
          description: Fecha/hora de registro del check-in.
          example: '2026-11-20T15:04:12Z'
    DetalleCheckinMs06:
      type: object
      description: Estado vigente de una persona en el evento, en el formato acordado con MS06.
      required:
        - usuarioId
        - estado
        - registradoEn
      properties:
        usuarioId:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        nombre:
          type: string
          nullable: true
          description: Nombre completo que entrega MS01; null si MS01 no respondió (RN-MS04-25).
          example: Ana María Pérez Gómez
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        zonaId:
          type: integer
          format: int64
          nullable: true
          description: Id del punto de encuentro; solo con SAFE, null en los demás estados.
          example: 3
        registradoEn:
          type: string
          format: date-time
          example: '2026-11-20T15:04:12Z'
    DetalleCheckinsMs06:
      type: object
      description: Formato acordado con MS06 para la ruta interna (no es el de los listados protegidos).
      required:
        - page
        - size
        - total
        - items
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total:
          type: integer
          description: Personas que cumplen el filtro, no los elementos de la página.
          example: 177
        items:
          type: array
          items:
            $ref: '#/components/schemas/DetalleCheckinMs06'
    TotalesPorEstado:
      type: object
      description: Siempre incluye los cuatro estados (RN-MS04-13).
      required:
        - SAFE
        - EVACUATING
        - NEEDS_ASSISTANCE
        - OFF_CAMPUS
      properties:
        SAFE:
          type: integer
          example: 120
        EVACUATING:
          type: integer
          example: 35
        NEEDS_ASSISTANCE:
          type: integer
          example: 4
        OFF_CAMPUS:
          type: integer
          example: 18
    TotalPorPunto:
      type: object
      required:
        - punto_encuentro_id
        - total
      properties:
        punto_encuentro_id:
          type: integer
          format: int64
          example: 3
        total:
          type: integer
          example: 80
    Consolidado:
      type: object
      required:
        - evento_id
        - estado_evento
        - total_reportados
        - totales_por_estado
        - por_punto_encuentro
        - calculado_en
      properties:
        evento_id:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        estado_evento:
          $ref: '#/components/schemas/EstadoEvento'
        total_reportados:
          type: integer
          description: Suma de los cuatro estados.
          example: 177
        totales_por_estado:
          $ref: '#/components/schemas/TotalesPorEstado'
        por_punto_encuentro:
          type: array
          description: Solo personas en SAFE.
          items:
            $ref: '#/components/schemas/TotalPorPunto'
        calculado_en:
          type: string
          format: date-time
          example: '2026-11-20T15:10:00Z'
    CheckinResumen:
      type: object
      required:
        - usuario_id
        - estado
        - fecha_hora
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        nombre:
          type: string
          nullable: true
          description: Nombre completo que entrega MS01; null si MS01 no respondió (RN-MS04-25).
          example: Ana María Pérez Gómez
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          nullable: true
          example: 3
        fecha_hora:
          type: string
          format: date-time
          example: '2026-11-20T15:04:12Z'
    Pendiente:
      type: object
      required:
        - usuario_id
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        nombre:
          type: string
          nullable: true
          description: Nombre completo que entrega MS01; null si MS01 no respondió (RN-MS04-25).
          example: Ana María Pérez Gómez
    PersonaAsistencia:
      type: object
      required:
        - usuario_id
        - ubicacion
        - fecha_reporte
        - solicitud_asistencia
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        nombre:
          type: string
          nullable: true
          description: Nombre completo que entrega MS01; null si MS01 no respondió (RN-MS04-25).
          example: Ana María Pérez Gómez
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        fecha_reporte:
          type: string
          format: date-time
          description: Fecha/hora de su check-in vigente.
          example: '2026-11-20T15:06:40Z'
        solicitud_asistencia:
          $ref: '#/components/schemas/SolicitudAsistencia'
    RegistroHistorial:
      type: object
      required:
        - checkin_id
        - usuario_id
        - estado
        - registrado_en
      properties:
        checkin_id:
          type: string
          format: uuid
          example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          nullable: true
          example: null
        ubicacion:
          allOf:
            - $ref: '#/components/schemas/Ubicacion'
          nullable: true
        registrado_en:
          type: string
          format: date-time
          example: '2026-11-20T15:02:05Z'
    PrimerCheckin:
      type: object
      required:
        - usuario_id
        - primer_checkin_en
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        primer_checkin_en:
          type: string
          format: date-time
          example: '2026-11-20T15:02:05Z'
    SolicitudResultado:
      type: object
      required:
        - usuario_id
        - solicitud_asistencia
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        solicitud_asistencia:
          $ref: '#/components/schemas/SolicitudAsistencia'
    Resultados:
      type: object
      required:
        - evento_id
        - simulacro
        - estado_evento
        - finales
        - total_reportados
        - totales_por_estado
        - por_punto_encuentro
        - solicitudes_asistencia
        - primeros_checkins
      properties:
        evento_id:
          type: string
          format: uuid
          example: 7c1d5b2e-4f3a-4e8b-9a61-0d2f8c3b5a17
        simulacro:
          type: boolean
          description: false es una emergencia o evento real.
          example: true
        estado_evento:
          $ref: '#/components/schemas/EstadoEvento'
        fecha_inicio:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-20T15:00:00Z'
        fecha_cierre:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-20T15:45:00Z'
        finales:
          type: boolean
          description: true si el evento está `FINALIZADO`; false si los resultados son parciales.
          example: true
        poblacion_objetivo:
          type: integer
          nullable: true
          description: null si MS01 no entregó la población objetivo.
          example: 200
        total_reportados:
          type: integer
          example: 177
        total_pendientes:
          type: integer
          nullable: true
          description: null si MS01 no entregó la población objetivo.
          example: 23
        totales_por_estado:
          $ref: '#/components/schemas/TotalesPorEstado'
        por_punto_encuentro:
          type: array
          items:
            $ref: '#/components/schemas/TotalPorPunto'
        solicitudes_asistencia:
          type: array
          description: Personas que reportaron NEEDS_ASSISTANCE al menos una vez.
          items:
            $ref: '#/components/schemas/SolicitudResultado'
        primeros_checkins:
          type: array
          description: Fecha/hora del primer check-in de cada usuario, para que MS06 y MS08 calculen sus indicadores.
          items:
            $ref: '#/components/schemas/PrimerCheckin'
    PaginaBase:
      type: object
      required:
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          example: 1
        total_paginas:
          type: integer
          example: 1
    EventoPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/Evento'
    CheckinPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/CheckinResumen'
    PendientePage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/Pendiente'
    AsistenciaPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/PersonaAsistencia'
    HistorialPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/RegistroHistorial'
    ErrorResponse:
      type: object
      description: Cuerpo de error normalizado (RNF-MS04-11 y Estándares). Los cinco campos son obligatorios; sin trazas internas.
      additionalProperties: false
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          example: 400
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
        correlation_id:
          type: string
          format: uuid
          description: Igual a la cabecera X-Correlation-ID.
          example: c19b472d-7a2a-4d3b-a12b-abcdef123456
