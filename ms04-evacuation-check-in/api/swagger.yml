          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          nullable: true
          example: 3
        fecha_hora:
          type: string
          format: date-time
          example: '2026-11-05T15:04:12Z'
    Pendiente:
      type: object
