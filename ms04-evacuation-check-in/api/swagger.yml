        totales_por_estado:
          $ref: '#/components/schemas/TotalesPorEstado'
        por_punto_encuentro:
          type: array
          description: Solo personas en SAFE.
          items:
            $ref: '#/components/schemas/TotalPorPunto'
        calculado_en:
          type: string
          format: date-time
          example: '2026-11-05T15:10:00Z'
    CheckinResumen:
