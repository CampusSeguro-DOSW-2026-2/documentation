      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
    PersonaAsistencia:
      type: object
      required:
        - usuario_id
        - ubicacion
        - fecha_reporte
        - solicitud_asistencia
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        ubicacion:
          $ref: '#/components/schemas/Ubicacion'
        fecha_reporte:
          type: string
          format: date-time
          example: '2026-11-05T15:06:40Z'
        solicitud_asistencia:
          $ref: '#/components/schemas/SolicitudAsistencia'
    RegistroHistorial:
      type: object
      required:
        - checkin_id
        - usuario_id
        - estado
        - registrado_en
      properties:
        checkin_id:
          type: string
          format: uuid
          example: 9a1b2c3d-4e5f-4a6b-8c7d-0e1f2a3b4c5d
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        estado:
          $ref: '#/components/schemas/EstadoCheckin'
        punto_encuentro_id:
          type: integer
          format: int64
          nullable: true
          example: null
        ubicacion:
          allOf:
            - $ref: '#/components/schemas/Ubicacion'
          nullable: true
        registrado_en:
          type: string
          format: date-time
          example: '2026-11-05T15:02:05Z'
    PrimerCheckin:
      type: object
      required:
        - usuario_id
        - primer_checkin_en
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        primer_checkin_en:
          type: string
          format: date-time
          example: '2026-11-05T15:02:05Z'
    SolicitudResultado:
      type: object
      required:
        - usuario_id
        - solicitud_asistencia
      properties:
        usuario_id:
          type: string
          format: uuid
          example: 3f6c2a9e-8b1d-4c7a-9e2f-1a5b7c9d0e42
        solicitud_asistencia:
          $ref: '#/components/schemas/SolicitudAsistencia'
    Resultados:
      type: object
      required:
        - evento_id
        - tipo
        - fecha_inicio
        - finales
        - total_reportados
        - totales_por_estado
        - por_punto_encuentro
        - solicitudes_asistencia
        - primeros_checkins
      properties:
        evento_id:
          type: string
          format: uuid
          example: 7f3c1a2e-9b4d-4c8a-9f1e-2a6d5c8b7e10
        tipo:
          type: string
          description: Tipo de alerta según MS03.
          example: SIMULATION
        fecha_inicio:
          type: string
          format: date-time
          example: '2026-11-05T15:00:00Z'
        fecha_cierre:
          type: string
          format: date-time
          nullable: true
          example: '2026-11-05T15:45:00Z'
        finales:
          type: boolean
          description: true si el evento está no vigente; false si los resultados son parciales.
          example: true
        poblacion_objetivo:
          type: integer
          nullable: true
          description: null si MS03 no entregó los destinatarios.
          example: 200
        total_reportados:
          type: integer
          example: 177
        total_pendientes:
          type: integer
          nullable: true
          description: null si MS03 no entregó los destinatarios.
          example: 23
        totales_por_estado:
          $ref: '#/components/schemas/TotalesPorEstado'
        por_punto_encuentro:
          type: array
          items:
            $ref: '#/components/schemas/TotalPorPunto'
        solicitudes_asistencia:
          type: array
          description: Personas que reportaron NEEDS_ASSISTANCE al menos una vez.
          items:
            $ref: '#/components/schemas/SolicitudResultado'
        primeros_checkins:
          type: array
          description: Fecha/hora del primer check-in de cada usuario, para que MS06 y MS08 calculen sus indicadores.
          items:
            $ref: '#/components/schemas/PrimerCheckin'
    PaginaBase:
      type: object
      required:
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          example: 1
        total_paginas:
          type: integer
          example: 1
    CheckinPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/CheckinResumen'
    PendientePage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/Pendiente'
    AsistenciaPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/PersonaAsistencia'
    HistorialPage:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required:
            - contenido
          properties:
            contenido:
              type: array
              items:
                $ref: '#/components/schemas/RegistroHistorial'
    ErrorResponse:
      type: object
      description: Cuerpo de error normalizado (RNF-MS04-11 y Estándares). Los cinco campos son obligatorios; sin trazas internas.
      additionalProperties: false
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          example: 400
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
        correlation_id:
          type: string
          format: uuid
          description: Igual a la cabecera X-Correlation-ID.
          example: c19b472d-7a2a-4d3b-a12b-abcdef123456
