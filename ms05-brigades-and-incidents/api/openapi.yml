  # ===========================================================================
  # 7. INTEGRACION INTERNA CON MS06 (SIMULACROS Y EVENTOS)
  # ===========================================================================
  /api/v1/bei/eventos/{eventoId}/estado:
    parameters:
      - $ref: '#/components/parameters/EventoIdPath'
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    put:
      tags:
        - Integracion MS06 (Eventos)
      operationId: actualizarEstadoOperativoEvento
      summary: Actualizar el estado operativo de un evento o simulacro desde MS06
      description: |
        Habilita o deshabilita la autoasignacion y el panel de brigadistas en
        MS05 segun el estado del evento notificado por MS06: `PROGRAMADO`
        habilita la autoasignacion; `EN_EJECUCION` habilita el panel de gestion
        y el registro de incidentes; `FINALIZADO` y `BORRADOR` deshabilitan
        ambos. Cualquier otro estado responde 400. Guarda tambien el nombre, el
        tipo (simulacro o real) y las ubicaciones del alcance del evento
        (`zonas` y `edificios`); el alcance guardado solo se reemplaza cuando
        llega al menos una ubicacion. Ruta interna: solo acepta
        `X-Service-Name: ms06`.
      x-acceso: interna
      x-servicio-autorizado: ms06
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarEstadoEventoRequest'
            examples:
              iniciarEvento:
                value:
                  eventoId: evt-simulacro-2026
                  nombre: Simulacro Nacional de Evacuacion
                  tipoEvento: SIMULACRO
                  simulacro: true
                  estado: EN_EJECUCION
                  fechaInicio: '2026-10-22T14:00:00Z'
                  fechaFin: null
                  zonas:
                    - zonaId: ZS-01
                      nombre: Zona segura norte
                      tipo: ZONA_SEGURA
                  edificios:
                    - BLD-B
      responses:
        '204':
          description: Configuracion operativa del evento actualizada.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

