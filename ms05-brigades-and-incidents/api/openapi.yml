            $ref: '#/components/schemas/AsignacionBrigadistaResumenResponse'
        tareasPendientes:
          type: array
          items:
            $ref: '#/components/schemas/IncidenteResumenDTO'
        metadatosPaginacion:
          $ref: '#/components/schemas/MetadatosPaginacionDTO'
    ListadoResponsabilidadesResponse:
      type: object
      required:
        - asignaciones
        - metadatosPaginacion
      properties:
        asignaciones:
          type: array
          items:
            $ref: '#/components/schemas/AsignacionResponse'
        metadatosPaginacion:
          $ref: '#/components/schemas/MetadatosPaginacionDTO'

    # -------------------------------------------------------------------------
    # DTOs de Incidentes, Atencion y Evidencias
    # -------------------------------------------------------------------------
    CrearIncidenteRequest:
      type: object
      required:
        - prioridadId
        - ubicacionId
        - tipoUbicacion
      properties:
        nombreAfectado:
          type:
            - string
            - 'null'
          maxLength: 150
        prioridadId:
          type: integer
          format: int64
          description: Identificador de la prioridad (1 = EMERGENCIA, 2 = URGENCIA_MODERADA, 3 = POCA_URGENCIA).
          example: 1
        ubicacionId:
          type: string
          minLength: 1
        tipoUbicacion:
          $ref: '#/components/schemas/TipoUbicacionEnum'
        descripcion:
          type:
            - string
            - 'null'
          maxLength: 1000
    EditarIncidenteRequest:
      type: object
      description: Los campos que no se envían quedan igual.
      properties:
        descripcion:
          type:
            - string
            - 'null'
          maxLength: 500
        prioridadId:
          type:
            - integer
            - 'null'
          format: int64
          minimum: 1
          description: >-
            Nueva prioridad del catálogo de MS05. Completa la solicitud de asistencia que MS04 crea desde el
            check-in con la prioridad por defecto. Una prioridad inexistente responde 400.
    AsignarResponsableRequest:
      type: object
      required:
        - responsableId
      properties:
        responsableId:
          type: string
          minLength: 1
          description: Identificador del brigadista activo que asumira la atencion del incidente.
        observaciones:
          type:
            - string
            - 'null'
    ResolverIncidenteRequest:
      type: object
      required:
        - observaciones
      properties:
        observaciones:
          type: string
          minLength: 1
          maxLength: 1000
          description: Detalle obligatorio de las acciones tomadas para resolver el incidente.
    IncidenteResponse:
      type: object
      required:
        - idIncidente
        - eventoId
        - reportanteId
        - ubicacionId
        - tipoUbicacion
        - prioridad
        - estado
        - fechaReporte
      properties:
        idIncidente:
          type: string
          format: uuid
        eventoId:
          type: string
        nombreAfectado:
          type:
            - string
            - 'null'
        reportanteId:
          type: string
        ubicacionId:
          type: string
        tipoUbicacion:
          $ref: '#/components/schemas/TipoUbicacionEnum'
        prioridad:
          $ref: '#/components/schemas/PrioridadIncidenteEnum'
        estado:
          $ref: '#/components/schemas/EstadoIncidenteEnum'
        descripcion:
          type:
            - string
            - 'null'
        fechaReporte:
          type: string
          format: date-time
    IncidenteResumenDTO:
      type: object
      required:
        - incidenteId
        - eventoId
        - zonaId
        - tipoUbicacion
        - prioridad
        - estado
        - reportadoEn
      properties:
        incidenteId:
          type: string
        eventoId:
          type: string
        zonaId:
          type: string
