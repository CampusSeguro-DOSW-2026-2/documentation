  /api/v1/brigadistas/eventos:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Brigadistas
      operationId: listarEventosOperacion
      summary: Listar los eventos abiertos que gestiona quien consulta
      description: |
        Devuelve los eventos programados o en ejecucion con sus edificios y el
        numero de brigadistas asignados a cada uno. Quien tiene
        `ms05:brigadier:assign_to_real` ve los eventos reales y quien tiene
        `ms05:brigadier:assign_to_drill` ve los simulacros; quien tiene los dos
        permisos ve ambos. Si el evento es un simulacro, `permiteReasignar` es
        `false`.
      x-permiso: ms05:brigadier:assign_to_drill | ms05:brigadier:assign_to_real
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '200':
          description: Eventos abiertos con sus edificios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventoOperacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/brigadistas/eventos/{eventoId}/gestion:
    parameters:
      - $ref: '#/components/parameters/EventoIdPath'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Brigadistas
      operationId: consultarGestionBrigadistasEvento
      summary: Consultar el panel de gestion de brigadistas de un evento
      description: |
        Devuelve el evento y sus brigadistas con su estado, su edificio en el
        evento y los incidentes que atienden y que resolvieron. La lista va
        ordenada: primero los activos, agrupados por el nombre del edificio
        asignado (orden alfabetico) y luego por nombre; despues los inactivos
        por nombre. Solo puede consultar un evento real quien tiene
        `ms05:brigadier:assign_to_real` y un simulacro quien tiene
        `ms05:brigadier:assign_to_drill`.
      x-permiso: ms05:brigadier:assign_to_drill | ms05:brigadier:assign_to_real
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      responses:
        '200':
          description: Panel de gestion del evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GestionBrigadistasEvento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/brigadistas/eventos/{eventoId}/brigadistas/{brigadistaId}/asignacion:
    parameters:
      - $ref: '#/components/parameters/EventoIdPath'
      - $ref: '#/components/parameters/BrigadistaIdPath'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    put:
      tags:
        - Brigadistas
      operationId: cambiarAsignacionBrigadistaEvento
      summary: Asignar o cambiar el edificio de un brigadista en un evento
      description: |
        Asigna al brigadista a un edificio del evento o le cambia el que tiene.
        El coordinador (`ms05:brigadier:assign_to_real`) actua sobre eventos
        reales y el organizador (`ms05:brigadier:assign_to_drill`) sobre
        simulacros; cada cambio queda en la auditoria. El evento debe estar
        programado o en ejecucion y el brigadista debe estar activo. Un edificio
        no puede quedar sin brigadistas: si el brigadista es el unico asignado
        a su edificio actual, la operacion responde 409.
      x-permiso: ms05:brigadier:assign_to_drill | ms05:brigadier:assign_to_real
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionEdificioRequest'
            example:
              ubicacionId: BLD-B
      responses:
        '200':
          description: Brigadista con su edificio actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrigadistaGestion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/brigadistas/autoasignacion:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    get:
      tags:
        - Brigadistas
      operationId: consultarAutoasignacion
      summary: Consultar la vista de autoasignacion del brigadista
      description: |
        Devuelve el estado del brigadista autenticado (`X-User-Id`) y los
        eventos abiertos en los que puede elegir edificio, cada uno con su
        asignacion vigente si la tiene.
      x-permiso: ms05:panel:read_own
      x-roles:
        - BRIGADISTA
      responses:
        '200':
          description: Estado del brigadista y eventos abiertos a la autoasignacion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Autoasignacion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/brigadistas/autoasignacion/eventos/{eventoId}:
    parameters:
      - $ref: '#/components/parameters/EventoIdPath'
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    put:
      tags:
        - Brigadistas
      operationId: autoasignarseEnEvento
      summary: Elegir o cambiar el edificio propio en un evento
      description: |
        El brigadista autenticado (`X-User-Id`) elige o cambia su edificio en un
        evento programado o en ejecucion. Debe estar activo y el edificio debe
        hacer parte del evento. Un edificio no puede quedar sin brigadistas: si
        es el unico asignado a su edificio actual, la operacion responde 409.
      x-permiso: ms05:panel:read_own
      x-roles:
        - BRIGADISTA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionEdificioRequest'
            example:
              ubicacionId: BLD-B
      responses:
        '200':
          description: Evento con la asignacion vigente del brigadista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoasignacionEvento'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
        - Brigadistas
      operationId: retirarAutoasignacionEvento
      summary: Quitar la asignacion propia de un evento
      description: |
        El brigadista autenticado (`X-User-Id`) retira su asignacion vigente de
        un evento programado o en ejecucion. Responde 409 si no tiene un edificio
        asignado en el evento o si es el unico brigadista de su edificio.
      x-permiso: ms05:panel:read_own
      x-roles:
        - BRIGADISTA
      responses:
        '200':
          description: Evento sin la asignacion del brigadista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoasignacionEvento'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ===========================================================================
  # 2. ASIGNACIONES DE BRIGADISTAS
  # ===========================================================================
  /api/v1/asignaciones:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    post:
      tags:
        - Asignaciones
      operationId: crearAsignacion
      summary: Crear una asignacion de brigadista a una ubicacion
      description: |
        El coordinador u organizador asigna un brigadista activo a un edificio,
        zona segura o punto de encuentro dentro de un evento. Valida el usuario
        en MS01 y la existencia de la ubicacion en MS02.
      x-permiso: ms05:brigadier:assign_to_drill | ms05:brigadier:assign_to_real
      x-roles:
        - COORDINADOR
        - ORGANIZADOR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAsignacionRequest'
            examples:
              edificio:
                value:
                  brigadistaId: usr-brig-001
                  eventoId: evt-simulacro-2026
                  ubicacionId: BLD-B
                  tipoUbicacion: EDIFICIO
                  observaciones: Cobertura del segundo piso del bloque B
      responses:
        '201':
          description: Asignacion creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/asignaciones/mis-asignaciones:
    parameters:
      - $ref: '#/components/parameters/UserIdHeader'
      - $ref: '#/components/parameters/UserPermissionHeader'
      - $ref: '#/components/parameters/UserRoleHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    post:
      tags:
        - Asignaciones
      operationId: autoasignarse
      summary: Autoasignacion del brigadista autenticado a una ubicacion
      description: |
        El brigadista autenticado solicita asignarse a una ubicacion en un
        evento que tenga `autoasignacionHabilitada = true`. El identificador del
        brigadista se toma directamente de la cabecera `X-User-Id`.
      x-permiso: ms05:panel:read_own
      x-roles:
        - BRIGADISTA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearAsignacionRequest'
            examples:
              autoasignacion:
                value:
                  brigadistaId: usr-brig-001
                  eventoId: evt-simulacro-2026
                  ubicacionId: ZS-NORTE
                  tipoUbicacion: ZONA_SEGURA
                  observaciones: Apoyo en evacuacion zona norte
      responses:
        '201':
          description: Autoasignacion creada exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsignacionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/asignaciones/predeterminadas:
    parameters:
      - $ref: '#/components/parameters/ServiceNameHeader'
      - $ref: '#/components/parameters/OptionalUserIdHeader'
      - $ref: '#/components/parameters/CorrelationIdHeader'
    post:
      tags:
        - Asignaciones
        - Integracion MS06 (Eventos)
      operationId: crearAsignacionesPredeterminadas
