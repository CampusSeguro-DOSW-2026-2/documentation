        - tamano
        - totalElementos
        - totalPaginas
      properties:
        pagina:
          type: integer
          format: int32
        tamano:
          type: integer
          format: int32
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int32
    PanelResponsabilidadesResponse:
      type: object
