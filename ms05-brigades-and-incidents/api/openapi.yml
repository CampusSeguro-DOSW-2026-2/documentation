        tipoContenido:
          type: string
          enum:
            - image/png
            - application/pdf
            - video/mp4
        referenciaArchivo:
          type: string
        fechaCarga:
          type: string
          format: date-time
    IncidenteDetalleDTO:
      type: object
      required:
        - idIncidente
        - eventoId
        - ubicacionId
        - tipoUbicacion
        - prioridad
        - estado
        - reportanteId
        - fechaReporte
        - evidencias
      properties:
        idIncidente:
          type: string
          format: uuid
        eventoId:
          type: string
        nombreAfectado:
          type:
            - string
            - 'null'
        ubicacionId:
          type: string
        tipoUbicacion:
          $ref: '#/components/schemas/TipoUbicacionEnum'
        descripcion:
          type:
            - string
            - 'null'
        prioridad:
          $ref: '#/components/schemas/PrioridadIncidenteEnum'
        estado:
          $ref: '#/components/schemas/EstadoIncidenteEnum'
        reportanteId:
          type: string
        brigadistaResponsableId:
          type:
            - string
            - 'null'
        fechaReporte:
          type: string
          format: date-time
        fechaPrimeraAtencion:
          type:
            - string
            - 'null'
          format: date-time
        fechaResolucion:
          type:
            - string
            - 'null'
          format: date-time
        observacionesResolucion:
          type:
            - string
            - 'null'
        fechaCierre:
          type:
            - string
            - 'null'
          format: date-time
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/EvidenciaIncidenteDTO'
    CambioEstadoIncidenteResponse:
      type: object
      required:
        - incidenteId
        - estadoAnterior
        - estadoNuevo
        - fechaCambio
      properties:
        incidenteId:
          type: string
          format: uuid
        estadoAnterior:
          $ref: '#/components/schemas/EstadoIncidenteEnum'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoIncidenteEnum'
        responsable:
          type:
            - string
            - 'null'
        fechaCambio:
          type: string
          format: date-time
    HistorialIncidenteResponse:
      type: object
      required:
        - id
        - estadoNuevo
        - actorId
        - fechaCambio
      properties:
        id:
          type: string
          format: uuid
        estadoAnterior:
          oneOf:
            - $ref: '#/components/schemas/EstadoIncidenteEnum'
            - type: 'null'
        estadoNuevo:
          $ref: '#/components/schemas/EstadoIncidenteEnum'
        responsableAnterior:
          type:
            - string
            - 'null'
        responsableNuevo:
          type:
            - string
            - 'null'
        actorId:
          type: string
        observaciones:
          type:
            - string
            - 'null'
        fechaCambio:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # DTOs de Integracion con MS06 (Simulacros y Eventos)
    # -------------------------------------------------------------------------
    ZonaEventoDTO:
      type: object
      properties:
        zonaId:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          description: Tipo de ubicacion (`EDIFICIO`, `ZONA_SEGURA` o `PUNTO_ENCUENTRO`). Tambien se acepta como `type` o `tipoUbicacion`. Sin tipo, se guarda como `ZONA_SEGURA`.
    ActualizarEstadoEventoRequest:
      type: object
      required:
        - estado
      properties:
        eventoId:
          type: string
        nombre:
          type: string
        tipoEvento:
          type: string
        simulacro:
          type: boolean
        estado:
          type: string
          description: Estado del evento en MS06. Define si se habilita la autoasignacion (`PROGRAMADO`) o el panel (`EN_EJECUCION`) o ninguno de los dos (`FINALIZADO`, `BORRADOR`).
          enum:
            - BORRADOR
            - PROGRAMADO
            - EN_EJECUCION
            - FINALIZADO
          example: EN_EJECUCION
        fechaInicio:
          type:
            - string
            - 'null'
          format: date-time
        fechaFin:
          type:
            - string
            - 'null'
          format: date-time
        zonas:
          type: array
          description: Ubicaciones del alcance del evento, con su tipo.
          items:
            $ref: '#/components/schemas/ZonaEventoDTO'
        edificios:
          type: array
          description: Ids de los edificios del alcance, que se guardan como ubicaciones de tipo `EDIFICIO`. Si un id tambien viene en `zonas`, se conserva el de `zonas`.
          items:
            type: string
    BrigadistaAsignadoDTO:
      type: object
      required:
        - brigadistaId
        - nombre
        - zonaId
        - estado
      properties:
        brigadistaId:
          type: string
        nombre:
          type: string
        zonaId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoBrigadistaEnum'
    BrigadistasEventoResponse:
      type: object
      required:
        - eventoId
        - actualizadoEn
        - brigadistas
      properties:
        eventoId:
          type: string
        actualizadoEn:
          type: string
          format: date-time
        brigadistas:
          type: array
          items:
            $ref: '#/components/schemas/BrigadistaAsignadoDTO'
    BrigadistaIndicadorDTO:
      type: object
      required:
        - brigadistaId
        - casosAtendidos
        - casosResueltos
      properties:
        brigadistaId:
          type: string
        casosAtendidos:
          type: integer
          format: int64
        casosResueltos:
          type: integer
          format: int64
    IndicadoresEventoResponse:
      type: object
      required:
        - eventoId
        - actualizadoEn
        - totalIncidentes
        - totalCasosAtendidos
        - totalCasosResueltos
        - porBrigadista
        - incidentes
      properties:
        eventoId:
          type: string
        actualizadoEn:
          type: string
          format: date-time
        totalIncidentes:
          type: integer
          format: int64
        totalCasosAtendidos:
          type: integer
          format: int64
        totalCasosResueltos:
          type: integer
          format: int64
        porBrigadista:
          type: array
          items:
            $ref: '#/components/schemas/BrigadistaIndicadorDTO'
        incidentes:
          type: array
          items:
            $ref: '#/components/schemas/IncidenteResumenDTO'
        tiempoPromedioAtencionSegundos:
          type:
            - integer
            - 'null'
          format: int64
          description: >-
            Promedio, en segundos, entre el reporte y la primera atención de los casos atendidos; null si ninguno se
            ha atendido. Atendido = EN_ATENCION, RESUELTO o CERRADO; resuelto = RESUELTO o CERRADO.

    # -------------------------------------------------------------------------
    # DTOs de Auditoria y Errores Estandar
    # -------------------------------------------------------------------------
    RegistroAuditoriaResponse:
      type: object
      required:
        - idRegistro
        - tipoRegistro
        - usuarioOrigen
        - accion
        - recursoTipo
        - recursoId
        - fechaHoraRegistro
        - origen
        - resultado
      properties:
        idRegistro:
          type: string
          format: uuid
        tipoRegistro:
          $ref: '#/components/schemas/TipoRegistroAuditoriaEnum'
        usuarioOrigen:
          type: string
        accion:
          type: string
        recursoTipo:
          type: string
        recursoId:
          type: string
        fechaHoraRegistro:
          type: string
          format: date-time
        eventoId:
          type:
            - string
            - 'null'
        origen:
          type: string
        resultado:
          type: string
        detalle:
          type:
            - string
            - 'null'
    ErrorCampo:
      type: object
      additionalProperties: false
      required:
        - campo
        - mensaje
      properties:
        campo:
          type: string
        mensaje:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      description: Cuerpo estandar de error de CampusSeguro (Estandares §7.1).
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          description: Codigo HTTP de la respuesta.
        codigo:
          type: string
          enum:
            - VALIDACION
            - NO_AUTENTICADO
            - PROHIBIDO
            - NO_ENCONTRADO
            - METODO_NO_PERMITIDO
            - CONFLICTO
            - TIPO_NO_SOPORTADO
            - REGLA_NEGOCIO
            - SERVICIO_NO_DISPONIBLE
            - ERROR_INTERNO
        mensaje:
          type: string
        errores:
          type: array
          items:
            $ref: '#/components/schemas/ErrorCampo'
        correlation_id:
          type: string
          format: uuid

    # -------------------------------------------------------------------------
    # Operacion de brigadistas en eventos abiertos
    # -------------------------------------------------------------------------
    EdificioEvento:
      type: object
      description: Edificio del alcance de un evento con el numero de brigadistas asignados en este momento.
      properties:
        ubicacionId:
          type: string
          example: BLD-B
        nombre:
          type: string
          example: Edificio B
        tipoUbicacion:
          type: string
          example: EDIFICIO
        brigadistasAsignados:
          type: integer
          format: int64
          example: 3
    EventoOperacion:
      type: object
      description: Evento programado o en ejecucion abierto a la operacion de brigadistas, con sus edificios.
      properties:
        eventoId:
          type: string
          example: evt-simulacro-2026
        nombre:
          type: string
          example: Simulacro de evacuacion
        simulacro:
          type: boolean
          example: true
        estado:
          type: string
          example: EN_EJECUCION
        permiteReasignar:
          type: boolean
          description: Indica si el coordinador puede cambiar asignaciones. Solo en eventos reales.
          example: false
        edificios:
          type: array
          items:
            $ref: '#/components/schemas/EdificioEvento'
    BrigadistaGestion:
      type: object
      description: Brigadista en el panel de gestion con su edificio en el evento y los incidentes que atiende y resolvio.
      properties:
        brigadistaId:
          type: string
          example: usr-brig-001
        nombre:
          type: string
          example: Carlos Ramirez
        estado:
          $ref: '#/components/schemas/EstadoBrigadistaEnum'
        idAsignacion:
          type: string
          nullable: true
          description: Identificador de la asignacion vigente en el evento, si la tiene.
        ubicacionId:
          type: string
          nullable: true
        nombreUbicacion:
          type: string
          nullable: true
        incidentesEnAtencion:
          type: integer
          format: int64
          example: 1
        incidentesResueltos:
          type: integer
          format: int64
          example: 2
    GestionBrigadistasEvento:
      type: object
      description: Panel de gestion de brigadistas de un evento.
      properties:
        evento:
          $ref: '#/components/schemas/EventoOperacion'
        brigadistas:
          type: array
          items:
            $ref: '#/components/schemas/BrigadistaGestion'
    SeleccionEdificioRequest:
      type: object
      description: Edificio del evento elegido por el brigadista o por el coordinador.
      required:
        - ubicacionId
      properties:
        ubicacionId:
          type: string
          description: Identificador de un edificio del evento. No puede estar vacio.
          example: BLD-B
    AutoasignacionEvento:
      type: object
      description: Evento abierto a la autoasignacion junto con la asignacion vigente del brigadista en el.
      properties:
        evento:
          $ref: '#/components/schemas/EventoOperacion'
        idAsignacion:
          type: string
          nullable: true
        ubicacionId:
          type: string
          nullable: true
        nombreUbicacion:
          type: string
          nullable: true
    Autoasignacion:
      type: object
      description: Vista de autoasignacion del brigadista.
      properties:
        brigadistaId:
          type: string
          example: usr-brig-001
        estado:
          $ref: '#/components/schemas/EstadoBrigadistaEnum'
        eventos:
          type: array
          items:
            $ref: '#/components/schemas/AutoasignacionEvento'
