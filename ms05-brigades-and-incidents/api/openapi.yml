                mensaje: Los datos enviados no son validos.
                errores:
                  - campo: ubicacionId
                    mensaje: La ubicacion es obligatoria
                correlation_id: 11111111-1111-4111-8111-111111111111
    Unauthorized:
      description: Faltan las cabeceras de identidad del Gateway (`NO_AUTENTICADO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noAutenticado:
              value:
                status: 401
                codigo: NO_AUTENTICADO
                mensaje: Se requiere autenticacion.
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Forbidden:
      description: El actor no posee el permiso requerido para la operacion (`PROHIBIDO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            prohibido:
              value:
                status: 403
                codigo: PROHIBIDO
                mensaje: No tiene permisos para realizar esta operacion.
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    NotFound:
      description: El recurso solicitado (incidente, asignacion, brigadista o ubicacion) no existe (`NO_ENCONTRADO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noEncontrado:
              value:
                status: 404
                codigo: NO_ENCONTRADO
                mensaje: No se encontro el incidente solicitado.
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    Conflict:
      description: Conflicto con el estado actual del recurso o asignacion duplicada (`CONFLICTO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflictoEstado:
              value:
                status: 409
                codigo: CONFLICTO
                mensaje: El brigadista ya tiene una asignacion vigente en esa ubicacion para el evento.
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111
    BadGateway:
      description: Fallo de comunicacion con el servicio externo de identidad MS01 (`SERVICIO_NO_DISPONIBLE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            errorMs01:
              value:
                status: 502
                codigo: SERVICIO_NO_DISPONIBLE
                mensaje: No fue posible completar la operacion con el servicio de identidad.
                errores: []
                correlation_id: 11111111-1111-4111-8111-111111111111

  schemas:
    # -------------------------------------------------------------------------
    # Catalogos / Enums
    # -------------------------------------------------------------------------
    EstadoBrigadistaEnum:
      type: string
      description: Estado operativo del brigadista en MS05.
      enum:
        - ACTIVO
        - INACTIVO
    EstadoAsignacionEnum:
      type: string
      description: Estado de una asignacion territorial de brigadista.
      enum:
        - VIGENTE
        - RETIRADA
    TipoUbicacionEnum:
      type: string
      description: Tipo de ubicacion fisica del campus validada contra MS02.
      enum:
        - EDIFICIO
        - ZONA_SEGURA
        - PUNTO_ENCUENTRO
    PrioridadIncidenteEnum:
      type: string
      description: Nivel de prioridad del incidente (IDs en base de datos 1, 2, 3).
      enum:
        - EMERGENCIA
        - URGENCIA_MODERADA
        - POCA_URGENCIA
    EstadoIncidenteEnum:
      type: string
      description: Estado del ciclo de vida de un incidente.
      enum:
        - REPORTADO
        - ASIGNADO
        - EN_ATENCION
        - RESUELTO
        - CERRADO
    TipoRegistroAuditoriaEnum:
      type: string
      description: Categoria del registro de auditoria en MS05.
      enum:
        - ASIGNACION
        - SOLICITUD
        - INCIDENTE
        - EVIDENCIA

    # -------------------------------------------------------------------------
