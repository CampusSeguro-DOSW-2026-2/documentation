openapi: 3.1.0
info:
  title: MS05 - Brigadistas e Incidentes
  description: |
    API de gestion de brigadistas, asignaciones territoriales por evento,
    panel de responsabilidades, ciclo de vida de incidentes, carga de
    evidencias multimedia, integracion operativa con MS06 (Simulacros y Eventos)
    y consulta de auditoria para la plataforma CampusSeguro.

    MS05 no valida JWT directamente: confia en la identidad que inyecta el
    API Gateway mediante las cabeceras `X-User-Id`, `X-User-Permission`,
    `X-User-Role`, `X-Service-Name` y `X-Correlation-ID`. El servicio solo se
    expone a traves del Gateway (protegido en el borde por Caddy con mTLS).

    La autorizacion de usuarios se decide exclusivamente con los permisos de
    `X-User-Permission` (formato `msNN:recurso:accion`), calculados por el
    Gateway como la union de los permisos de todos los roles del usuario.
    `X-User-Role` no se lee para autorizar.

    Las llamadas internas servicio a servicio desde MS06 (Simulacros y Eventos)
    son las operaciones marcadas con `x-acceso: interna` y
    `x-servicio-autorizado: ms06`: crear asignaciones predeterminadas,
    actualizar el estado operativo del evento y consultar brigadistas e
    indicadores del evento. El API Gateway valida `X-Service-Key` e inyecta
    `X-Service-Name: ms06`, y MS05 solo acepta ese valor en ellas.

    Permisos utilizados por MS05:
    - `ms05:brigadier:assign_to_real` (eventos reales) o `ms05:brigadier:assign_to_drill` (simulacros): Buscar brigadistas, cambiar su estado operativo y gestionar asignaciones a edificios, zonas seguras o puntos de encuentro (COORDINADOR, ORGANIZADOR).
    - `ms05:panel:read_own`: Consultar panel propio de responsabilidades, autoasignarse y cambiar el estado propio de disponibilidad (BRIGADISTA).
    - `ms05:incident:report`: Registrar incidentes y adjuntar evidencias multimedia (ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR).
    - `ms05:incident:read`: Consultar incidentes, detalles, historial, evidencias, asignaciones y listado general de responsabilidades.
    - `ms05:incident:manage_own`: Consultar los incidentes propios con el listado filtrado (todos los roles).
    - `ms05:incident:update`: Modificar la descripcion de un incidente (propietario o brigadista activo).
    - `ms05:assistance:assign_to_real` (eventos reales) o `ms05:assistance:assign_to_drill` (simulacros): Asignar brigadista responsable a un incidente, cerrarlo o eliminarlo logicamente cuando esta resuelto (COORDINADOR).
    - `ms05:assistance:update_status`: Iniciar atencion y resolver incidentes como brigadista responsable (BRIGADISTA, COORDINADOR).
    - `ms08:audit_real_event:read` (eventos reales) o `ms08:audit_drill:read` (simulacros): Consultar los registros de auditoria de MS05 (AUDITOR).
  version: 1.0.0
  license:
    name: Uso academico - CampusSeguro (ECI Julio Garavito)
servers:
  - url: http://localhost:8080
    description: API Gateway local (MS05 escucha en el puerto 8085 sin exposicion publica directa)
  - url: http://localhost:8085
    description: Contenedor local MS05 (desarrollo y pruebas directas)
tags:
  - name: Brigadistas
    description: Activacion, cambio de disponibilidad y busqueda de brigadistas (integrado con MS01)
  - name: Asignaciones
    description: Asignacion manual, autoasignacion, retiro y asignaciones predeterminadas de brigadistas a ubicaciones (integrado con MS01 y MS02)
  - name: Responsabilidades
    description: Panel personal del brigadista y listado general paginado de responsabilidades por evento y ubicacion
  - name: Incidentes
    description: Registro, edicion, consulta filtrada paginada, detalle y eliminacion logica de incidentes
  - name: Atencion de Incidentes
    description: Asignacion de brigadista responsable (con alerta a MS03), inicio de atencion, resolucion, cierre e historial de transiciones
  - name: Evidencias de Incidentes
    description: Carga y listado de archivos multimedia de evidencia (PNG, PDF, MP4 hasta 20 MB)
  - name: Integracion MS06 (Eventos)
    description: Endpoints internos exclusivos para MS06 (estado operativo del evento, brigadistas e indicadores)
  - name: Auditoria
