openapi: 3.0.3
info:
  title: ms07-training-and-ai-assistant
  version: 0.1.0
  description: |
    Learning center, contents, evaluations, progress and AI tutor of CampusSeguro (MS07).

    **Identity inputs:** every endpoint receives `X-User-Id` (UUID) and `X-User-Role` (comma-separated roles), set by the API Gateway, and accepts `X-Correlation-ID`. If the identity headers are missing, MS07 answers 401. Each endpoint declares the permission it requires (`x-permiso`) and the authorized roles (`x-roles`) according to the role-permission matrix of the `documentation` repository (`roles_y_permisos/matriz-roles-permisos.md`). A user with several roles has the union of their permissions. If none of the roles has the permission, MS07 answers 403. ADMIN only manages; AUDITOR has no MS07 permission.

    **Deletion:** MS07 never deletes. Categories and contents are deactivated and can be reactivated.

    **Pagination:** lists take `page` (from 0) and `size` (default 20, max 100) and answer with the common page envelope (`contenido`, `page`, `size`, `total_elementos`, `total_paginas`).

    **Pending:** tutor (RF-15) will be added to this contract by its owner.
servers:
  - url: http://localhost:8080/api/v1
    description: External access (API Gateway)
tags:
  - name: Categories
  - name: Contents
  - name: Evaluations
  - name: Progress
paths:
  /training/categories:
    get:
      tags:
        - Categories
      summary: List categories (RF-11, RF-12) - Community and ADMIN
      x-permiso: [ms07:content:read, ms07:content:manage]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR, ADMIN]
      description: Active categories ordered by name. With `includeInactive=true` inactive categories are also returned; this only applies to ADMIN and is ignored for other roles.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of categories.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Categories
      summary: Create category (RF-11) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Creates the category with status ACTIVO. The name is unique regardless of case, including inactive categories.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Category created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
  /training/categories/{id}:
    put:
      tags:
        - Categories
      summary: Update category (RF-11) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Updates name and description. The status does not change here.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Category updated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CategoryNameConflict'
  /training/categories/{id}/deactivate:
    patch:
      tags:
        - Categories
      summary: Deactivate category (RF-11) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Sets the status to INACTIVO. Its contents are kept, but they are hidden from the community and no new content can be created in it.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Category deactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyInactive'
  /training/categories/{id}/reactivate:
    patch:
      tags:
        - Categories
      summary: Reactivate category (RF-11) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Sets the status back to ACTIVO.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Category reactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyActive'
  /training/contents:
    get:
      tags:
        - Contents
      summary: List contents (RF-10, RF-12) - Community and ADMIN
      x-permiso: [ms07:content:read, ms07:content:manage]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR, ADMIN]
      description: Contents ordered from the most recently updated, optionally filtered by category. The community only gets active contents of active categories. With `includeInactive=true` ADMIN gets every content; the flag is ignored for other roles. The list does not include the body; use the detail endpoint.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/CategoryIdFilter'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of contents.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Contents
      summary: Create content (RF-10) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Creates the content with status ACTIVO. The category must exist and be active.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '201':
          description: Content created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /training/contents/{id}:
    get:
      tags:
        - Contents
      summary: Get content (RF-10, RF-12) - Community and ADMIN
      x-permiso: [ms07:content:read, ms07:content:manage]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR, ADMIN]
      description: Full content with its body. For the community, an inactive content or a content of an inactive category answers 404. ADMIN can read any content.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Content.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Contents
      summary: Update content (RF-10) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Updates title, body and category. The current category can be kept even if it is now inactive; changing to another category requires it to exist and be active. The status does not change here.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentRequest'
      responses:
        '200':
          description: Content updated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /training/contents/{id}/deactivate:
    patch:
      tags:
        - Contents
      summary: Deactivate content (RF-10) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Sets the status to INACTIVO. The content is hidden from the community and from the tutor.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Content deactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyInactive'
  /training/contents/{id}/reactivate:
    patch:
      tags:
        - Contents
      summary: Reactivate content (RF-10) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Sets the status back to ACTIVO. If its category is inactive, the content stays hidden from the community until the category is reactivated.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Content reactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AlreadyActive'
  /training/evaluations:
    get:
      tags:
        - Evaluations
      summary: List evaluations (RF-14) - Community and ADMIN
      x-permiso: [ms07:quiz:take, ms07:content:manage]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR, ADMIN]
      description: Evaluations ordered by title, optionally filtered by category. The community gets only active evaluations, even when their category is inactive. With `includeInactive=true` ADMIN also gets inactive evaluations; the flag is ignored for other roles. The list does not include the questions; use the detail endpoint.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
        - $ref: '#/components/parameters/EvaluationCategoryFilter'
        - $ref: '#/components/parameters/IncludeInactive'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Page of evaluations.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Evaluations
      summary: Create evaluation (RF-14) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Creates the evaluation with status ACTIVO, with its questions and options in the order they are sent. The category must exist and be active. The evaluation needs at least one question, each question at least two options and exactly one correct option (422 otherwise).
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '201':
          description: Evaluation created, including which option of each question is correct.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/EvaluationRulesNotMet'
  /training/evaluations/{id}:
    get:
      tags:
        - Evaluations
      summary: Get evaluation (RF-14) - Community and ADMIN
      x-permiso: [ms07:quiz:take, ms07:content:manage]
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR, ADMIN]
      description: Evaluation with its questions and options in order. The community never receives which option is correct (`correct` is omitted) and an inactive evaluation answers 404 to it. ADMIN gets any evaluation with `correct` in every option.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Evaluation.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
              examples:
                community:
                  summary: Community view (without the correct option)
                  value:
                    id: 8c2e4a61-7d3b-4f9e-b1a2-3c4d5e6f7a8b
                    title: Evacuación básica
                    topic: Rutas de salida
                    categoryId: 00000000-0000-0000-0000-000000000004
                    status: ACTIVO
                    questions:
                      - id: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
                        position: 1
                        statement: ¿Por dónde se debe salir?
                        options:
                          - id: 2b3c4d5e-6f7a-4b2c-9d3e-4f5a6b7c8d9e
                            position: 1
                            text: Por la escalera
                          - id: 3c4d5e6f-7a8b-4c3d-8e4f-5a6b7c8d9e0f
                            position: 2
                            text: Por el ascensor
                    createdAt: '2026-11-17T15:00:00Z'
                    updatedAt: '2026-11-17T15:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
    put:
      tags:
        - Evaluations
      summary: Update evaluation (RF-14) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Updates title, topic, category and questions. Questions and options are replaced as a whole. The current category can be kept even if it is now inactive; changing to another category requires it to exist and be active. An evaluation that already has attempts cannot be updated (409); deactivate it and create a new one. The status does not change here.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationRequest'
      responses:
        '200':
          description: Evaluation updated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        '409':
          $ref: '#/components/responses/EvaluationHasAttempts'
        '422':
          $ref: '#/components/responses/EvaluationRulesNotMet'
  /training/evaluations/{id}/deactivate:
    patch:
      tags:
        - Evaluations
      summary: Deactivate evaluation (RF-14) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Changes the status to INACTIVO. The evaluation and its attempts are kept; the community stops seeing it.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Evaluation deactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        '409':
          $ref: '#/components/responses/EvaluationAlreadyInactive'
  /training/evaluations/{id}/reactivate:
    patch:
      tags:
        - Evaluations
      summary: Reactivate evaluation (RF-14) - ADMIN
      x-permiso: ms07:content:manage
      x-roles: [ADMIN]
      description: Changes the status to ACTIVO, keeping its questions and attempts.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Evaluation reactivated.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        '409':
          $ref: '#/components/responses/EvaluationAlreadyActive'
  /training/evaluations/{id}/attempts:
    post:
      tags:
        - Evaluations
      summary: Answer evaluation (RF-14) - Community
      x-permiso: ms07:quiz:take
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Registers an attempt of the user identified by `X-User-Id` (never by the body). Every question must be answered exactly once with one of its own options. The score is the percentage of correct answers (0 to 100, rounded). The attempt stores the score, the topic of the evaluation and the date. A user can answer the same evaluation several times. An inactive evaluation answers 422 and nothing is registered.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttemptRequest'
      responses:
        '201':
          description: Attempt registered, with the score and the correction of each answer.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/AttemptInvalidAnswers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/EvaluationNotFound'
        '422':
          $ref: '#/components/responses/EvaluationInactive'
  /training/contents/{id}/views:
    post:
      tags:
        - Progress
      summary: Register content view (RF-13) - Community
      x-permiso: ms07:content:read
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Records that the user identified by `X-User-Id` (never by the body) opened the content. There is a single record per user and content (RF-13 rule 2) - the first view creates it (201) and every later view only moves `lastViewedAt` (200). Simultaneous views of the same user never create duplicates. The front calls it when the user opens a content. An inactive content answers 422 and nothing is registered.
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '201':
          description: First view of the content by this user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '200':
          description: The content was already viewed; only the date of the last view changed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/ContentNotFound'
        '422':
          $ref: '#/components/responses/ContentNotAvailable'
  /training/progress/me:
    get:
      tags:
        - Progress
      summary: My progress (RF-13) - Community
      x-permiso: ms07:quiz:take
      x-roles: [ESTUDIANTE, PROFESOR, ADMINISTRATIVO, BRIGADISTA, COORDINADOR, ORGANIZADOR]
      description: Progress of the user identified by `X-User-Id` only (rule MR-02); there is no route to read the progress of another user. `contents` lists the viewed contents, newest view first. `evaluations` has one item per answered evaluation with its best attempt (highest score; on a tie, the most recent), newest first. A content or evaluation deactivated after it was used comes with `available = false`. Without records both lists are empty.
      parameters:
        - $ref: '#/components/parameters/XUserId'
        - $ref: '#/components/parameters/XUserRole'
        - $ref: '#/components/parameters/XUserPermission'
        - $ref: '#/components/parameters/XCorrelationId'
      responses:
        '200':
          description: Progress of the current user.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  headers:
    XCorrelationID:
      description: UUID v4 that links the logs of a request across services. If it does not arrive, MS07 generates one.
      schema:
        type: string
        format: uuid
        example: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Resource id (UUID). A value with an invalid format answers 400.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-0000-0000-000000000004
    XUserId:
      name: X-User-Id
      in: header
      required: true
      description: Id (UUID) of the authenticated user. Set by the API Gateway.
      schema:
        type: string
        format: uuid
        example: 9b2d4e61-5c3a-4f8e-a7d1-2e6f8c0b4a19
    XUserRole:
      name: X-User-Role
      in: header
      required: true
      description: Comma-separated roles of the authenticated user. Set by the API Gateway.
      schema:
        type: string
        example: BRIGADISTA,ESTUDIANTE
    XUserPermission:
      name: X-User-Permission
      in: header
      required: true
      description: Comma-separated permissions of the authenticated user (union of all their roles). Set by the API Gateway. MS07 authorizes only by this header, never by role name.
      schema:
        type: string
        example: ms07:content:read,ms07:quiz:take,ms07:tutor:use
    EvaluationCategoryFilter:
      name: categoryId
      in: query
      required: false
      description: Only evaluations of this category. Without it, evaluations of every category are returned.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-0000-0000-000000000004
    XCorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Request trace id (UUID v4).
      schema:
        type: string
        format: uuid
        example: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    IncludeInactive:
      name: includeInactive
      in: query
      required: false
      description: Also return inactive items. Only applies to ADMIN; ignored for other roles.
      schema:
        type: boolean
        default: false
    CategoryIdFilter:
      name: categoryId
      in: query
      required: false
      description: Only contents of this category. Without it, contents of every category are returned.
      schema:
        type: string
        format: uuid
        example: 00000000-0000-0000-0000-000000000004
    Page:
      name: page
      in: query
      required: false
      description: Page number, starting at 0.
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size. A value above 100 answers 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    BadRequest:
      description: Validation failed (states the field and the rule). Also applies to path ids, query parameters with an invalid format and page sizes above 100.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidField:
              summary: Invalid body field
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: name
                    mensaje: El nombre es obligatorio.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            invalidId:
              summary: Path id with an invalid format
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: id
                    mensaje: Valor con formato inválido.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    Unauthorized:
      description: Identity headers are missing (X-User-Id / X-User-Role).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 401
            codigo: NO_AUTENTICADO
            mensaje: Faltan las cabeceras de identidad.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    Forbidden:
      description: None of the roles in X-User-Role has the permission required by the endpoint (`x-permiso`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 403
            codigo: PROHIBIDO
            mensaje: No tiene permiso para realizar esta operación.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: La categoría no existe.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    CategoryNameConflict:
      description: A category with that name already exists (case-insensitive, including inactive ones).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: Ya existe una categoría con ese nombre.
            errores:
              - campo: name
                mensaje: Ya existe una categoría con ese nombre.
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    AlreadyInactive:
      description: The resource is already inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: La categoría ya está inactiva.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    AlreadyActive:
      description: The resource is already active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: La categoría ya está activa.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    UnprocessableEntity:
      description: Business rule not met (for example, the category does not exist or is inactive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            codigo: REGLA_NEGOCIO
            mensaje: La categoría 'Laboratorios' está inactiva.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationNotFound:
      description: The evaluation does not exist (or, for the community, it is inactive).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: La evaluación no existe.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationRulesNotMet:
      description: The questions or the category do not meet the rules of RF-14.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            noQuestions:
              summary: Without questions
              value:
                status: 422
                codigo: REGLA_NEGOCIO
                mensaje: La evaluación debe tener al menos una pregunta.
                errores: []
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            fewOptions:
              summary: A question with fewer than two options
              value:
                status: 422
                codigo: REGLA_NEGOCIO
                mensaje: La pregunta 2 debe tener al menos dos opciones.
                errores: []
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            correctOption:
              summary: A question without exactly one correct option
              value:
                status: 422
                codigo: REGLA_NEGOCIO
                mensaje: La pregunta 1 debe tener exactamente una opción correcta.
                errores: []
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            inactiveCategory:
              summary: Inactive category
              value:
                status: 422
                codigo: REGLA_NEGOCIO
                mensaje: La categoría 'Laboratorios' está inactiva.
                errores: []
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationHasAttempts:
      description: The evaluation already has attempts, so its questions cannot change.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: 'La evaluación ya tiene intentos registrados: inactívela y cree una nueva.'
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationAlreadyInactive:
      description: The evaluation is already inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: La evaluación ya está inactiva.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationAlreadyActive:
      description: The evaluation is already active.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 409
            codigo: CONFLICTO
            mensaje: La evaluación ya está activa.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    EvaluationInactive:
      description: The evaluation is inactive; the attempt is not registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            codigo: REGLA_NEGOCIO
            mensaje: La evaluación no está activa.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    AttemptInvalidAnswers:
      description: The answers are missing or do not match the questions of the evaluation. Also applies to path ids with an invalid format.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unanswered:
              summary: A question without answer
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: answers
                    mensaje: Falta responder la pregunta 3.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            repeated:
              summary: The same question answered twice
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: answers
                    mensaje: Cada pregunta se responde una sola vez.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            wrongOption:
              summary: An option of another question
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: answers
                    mensaje: La opción elegida no pertenece a la pregunta 1.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
            otherEvaluation:
              summary: A question of another evaluation
              value:
                status: 400
                codigo: VALIDACION
                mensaje: Datos inválidos.
                errores:
                  - campo: answers
                    mensaje: Hay respuestas a preguntas que no son de esta evaluación.
                correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    ContentNotFound:
      description: The content does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 404
            codigo: NO_ENCONTRADO
            mensaje: El contenido no existe.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    ContentNotAvailable:
      description: The content is inactive; the view is not registered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 422
            codigo: REGLA_NEGOCIO
            mensaje: El contenido no está disponible.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
    ServiceUnavailable:
      description: A dependency did not answer in time (for example, the AI provider used by the tutor).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 503
            codigo: DEPENDENCIA_NO_DISPONIBLE
            mensaje: El tutor no está disponible en este momento. Puedes consultar el centro de aprendizaje.
            errores: []
            correlation_id: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
  schemas:
    Status:
      type: string
      description: Values fixed by the integration standards.
      enum:
        - ACTIVO
        - INACTIVO
    CategoryRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Unique regardless of case, including inactive categories.
          example: Simulacros
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Optional.
          example: Preparación y desarrollo de simulacros de evacuación.
    Category:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000004
        name:
          type: string
          example: Evacuación
        description:
          type: string
          nullable: true
          example: Cómo evacuar de forma segura.
        status:
          $ref: '#/components/schemas/Status'
    ContentRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - body
        - categoryId
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
          example: Qué hacer si tiembla en el salón
        body:
          type: string
          minLength: 1
          maxLength: 20000
          description: Plain text shown in the learning center and used by the tutor.
          example: Agáchate, cúbrete y sujétate. Aléjate de ventanas y estanterías.
        categoryId:
          type: string
          format: uuid
          description: Must exist and be active (on update, it may stay the same even if it is now inactive).
          example: 00000000-0000-0000-0000-000000000006
    ContentSummary:
      type: object
      required:
        - id
        - title
        - categoryId
        - status
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 5d1f3a9c-2b7e-4c8d-9a6f-0e1b2c3d4e5f
        title:
          type: string
          example: Qué hacer si tiembla en el salón
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000006
        status:
          $ref: '#/components/schemas/Status'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-09T15:30:00Z'
    Content:
      type: object
      required:
        - id
        - title
        - body
        - categoryId
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 5d1f3a9c-2b7e-4c8d-9a6f-0e1b2c3d4e5f
        title:
          type: string
          example: Qué hacer si tiembla en el salón
        body:
          type: string
          example: Agáchate, cúbrete y sujétate. Aléjate de ventanas y estanterías.
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000006
        status:
          $ref: '#/components/schemas/Status'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-09T15:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-09T15:30:00Z'
    CategoryPage:
      type: object
      description: Common page envelope; field names are fixed by the integration standards.
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Category'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          format: int64
          example: 8
        total_paginas:
          type: integer
          example: 1
    ContentSummaryPage:
      type: object
      description: Common page envelope; field names are fixed by the integration standards.
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          format: int64
          example: 1
        total_paginas:
          type: integer
          example: 1
    EvaluationRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - topic
        - categoryId
        - questions
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 150
          example: Evacuación básica
        topic:
          type: string
          minLength: 1
          maxLength: 150
          description: Topic (tema) stored with every attempt.
          example: Rutas de salida
        categoryId:
          type: string
          format: uuid
          description: Must exist and be active (on update, it may stay the same even if it is now inactive).
          example: 00000000-0000-0000-0000-000000000004
        questions:
          type: array
          minItems: 1
          maxItems: 50
          description: In order. At least one question (422 otherwise).
          items:
            $ref: '#/components/schemas/EvaluationQuestionRequest'
    EvaluationQuestionRequest:
      type: object
      additionalProperties: false
      required:
        - statement
        - options
      properties:
        statement:
          type: string
          minLength: 1
          maxLength: 500
          example: ¿Por dónde se debe salir?
        options:
          type: array
          minItems: 2
          maxItems: 10
          description: In order. At least two options and exactly one with `correct = true` (422 otherwise).
          items:
            $ref: '#/components/schemas/EvaluationOptionRequest'
    EvaluationOptionRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - correct
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 300
          example: Por la escalera
        correct:
          type: boolean
          example: true
    EvaluationSummary:
      type: object
      required:
        - id
        - title
        - topic
        - categoryId
        - status
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 8c2e4a61-7d3b-4f9e-b1a2-3c4d5e6f7a8b
        title:
          type: string
          example: Evacuación básica
        topic:
          type: string
          example: Rutas de salida
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000004
        status:
          $ref: '#/components/schemas/Status'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-17T15:00:00Z'
    Evaluation:
      type: object
      required:
        - id
        - title
        - topic
        - categoryId
        - status
        - questions
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          example: 8c2e4a61-7d3b-4f9e-b1a2-3c4d5e6f7a8b
        title:
          type: string
          example: Evacuación básica
        topic:
          type: string
          example: Rutas de salida
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000004
        status:
          $ref: '#/components/schemas/Status'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationQuestion'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-17T15:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2026-11-17T15:00:00Z'
    EvaluationQuestion:
      type: object
      required:
        - id
        - position
        - statement
        - options
      properties:
        id:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
        position:
          type: integer
          minimum: 1
          example: 1
        statement:
          type: string
          example: ¿Por dónde se debe salir?
        options:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationOption'
    EvaluationOption:
      type: object
      required:
        - id
        - position
        - text
      properties:
        id:
          type: string
          format: uuid
          example: 2b3c4d5e-6f7a-4b2c-9d3e-4f5a6b7c8d9e
        position:
          type: integer
          minimum: 1
          example: 1
        text:
          type: string
          example: Por la escalera
        correct:
          type: boolean
          description: Only for ADMIN (`ms07:content:manage`). Omitted in the community view.
          example: true
    EvaluationSummaryPage:
      type: object
      description: Common page envelope; field names are fixed by the integration standards.
      required:
        - contenido
        - page
        - size
        - total_elementos
        - total_paginas
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationSummary'
        page:
          type: integer
          example: 0
        size:
          type: integer
          example: 20
        total_elementos:
          type: integer
          format: int64
          example: 1
        total_paginas:
          type: integer
          example: 1
    AttemptRequest:
      type: object
      additionalProperties: false
      required:
        - answers
      properties:
        answers:
          type: array
          description: One answer per question of the evaluation.
          items:
            $ref: '#/components/schemas/AttemptAnswer'
    AttemptAnswer:
      type: object
      additionalProperties: false
      required:
        - questionId
        - optionId
      properties:
        questionId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
        optionId:
          type: string
          format: uuid
          example: 2b3c4d5e-6f7a-4b2c-9d3e-4f5a6b7c8d9e
    Attempt:
      type: object
      required:
        - id
        - evaluationId
        - topic
        - score
        - correctAnswers
        - totalQuestions
        - attemptedAt
        - answers
      properties:
        id:
          type: string
          format: uuid
          example: 4d5e6f7a-8b9c-4d0e-9f1a-2b3c4d5e6f7a
        evaluationId:
          type: string
          format: uuid
          example: 8c2e4a61-7d3b-4f9e-b1a2-3c4d5e6f7a8b
        topic:
          type: string
          description: Topic of the evaluation when the attempt was registered.
          example: Rutas de salida
        score:
          type: integer
          minimum: 0
          maximum: 100
          description: Percentage of correct answers, rounded.
          example: 50
        correctAnswers:
          type: integer
          example: 1
        totalQuestions:
          type: integer
          example: 2
        attemptedAt:
          type: string
          format: date-time
          example: '2026-11-17T16:20:00Z'
        answers:
          type: array
          description: Correction of each answer, in the order of the questions.
          items:
            $ref: '#/components/schemas/AttemptAnswerResult'
    AttemptAnswerResult:
      type: object
      required:
        - questionId
        - optionId
        - correct
        - correctOptionId
      properties:
        questionId:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a1b-8c2d-3e4f5a6b7c8d
        optionId:
          type: string
          format: uuid
          description: Option chosen by the user.
          example: 3c4d5e6f-7a8b-4c3d-8e4f-5a6b7c8d9e0f
        correct:
          type: boolean
          example: false
        correctOptionId:
          type: string
          format: uuid
          example: 2b3c4d5e-6f7a-4b2c-9d3e-4f5a6b7c8d9e
    ContentView:
      type: object
      required:
        - contentId
        - firstViewedAt
        - lastViewedAt
      properties:
        contentId:
          type: string
          format: uuid
          example: 5d1f3a9c-2b7e-4c8d-9a6f-0e1b2c3d4e5f
        firstViewedAt:
          type: string
          format: date-time
          example: '2026-11-10T10:00:00Z'
        lastViewedAt:
          type: string
          format: date-time
          example: '2026-11-17T10:00:00Z'
    Progress:
      type: object
      required:
        - contents
        - evaluations
      properties:
        contents:
          type: array
          items:
            $ref: '#/components/schemas/ProgressContent'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/ProgressEvaluation'
    ProgressContent:
      type: object
      required:
        - contentId
        - title
        - categoryId
        - firstViewedAt
        - lastViewedAt
        - available
      properties:
        contentId:
          type: string
          format: uuid
          example: 5d1f3a9c-2b7e-4c8d-9a6f-0e1b2c3d4e5f
        title:
          type: string
          example: Qué hacer si tiembla en el salón
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000006
        firstViewedAt:
          type: string
          format: date-time
          example: '2026-11-10T10:00:00Z'
        lastViewedAt:
          type: string
          format: date-time
          example: '2026-11-17T10:00:00Z'
        available:
          type: boolean
          description: False when the content was deactivated after the user viewed it ("no disponible").
          example: true
    ProgressEvaluation:
      type: object
      required:
        - evaluationId
        - title
        - categoryId
        - topic
        - bestScore
        - attemptedAt
        - attempts
        - available
      properties:
        evaluationId:
          type: string
          format: uuid
          example: 8c2e4a61-7d3b-4f9e-b1a2-3c4d5e6f7a8b
        title:
          type: string
          example: Evacuación básica
        categoryId:
          type: string
          format: uuid
          example: 00000000-0000-0000-0000-000000000004
        topic:
          type: string
          description: Topic of the best attempt.
          example: Rutas de salida
        bestScore:
          type: integer
          minimum: 0
          maximum: 100
          example: 67
        attemptedAt:
          type: string
          format: date-time
          description: Date of the best attempt.
          example: '2026-11-17T16:20:00Z'
        attempts:
          type: integer
          minimum: 1
          example: 3
        available:
          type: boolean
          description: False when the evaluation was deactivated after the user answered it.
          example: true
    ErrorResponse:
      type: object
      description: Normalized error body without internal traces. Field names and codes are fixed by the integration standards.
      required:
        - status
        - codigo
        - mensaje
        - errores
        - correlation_id
      properties:
        status:
          type: integer
          example: 400
        codigo:
          type: string
          example: VALIDACION
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            required:
              - campo
              - mensaje
            properties:
              campo:
                type: string
              mensaje:
                type: string
        correlation_id:
          type: string
          format: uuid
          example: 7b0c8f2e-3c1d-4f5a-9e6b-1a2b3c4d5e6f
